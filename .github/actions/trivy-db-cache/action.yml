name: Restore trivy DB
description: >-
  Restores the newest trivy vulnerability DB that nightly-security.yml
  cached, so scan jobs don't each download ~90 MB from the registry (#723).
  Trivy still refreshes it itself once the DB's NextUpdate has passed, so a
  restored DB is never staler than a fresh download would be. Restore only:
  the nightly run is the single writer, keeping one entry in the cache
  instead of one per PR and day next to the buildx layer caches.

runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/trivy/db
        # Never an exact hit: the prefix picks the newest entry.
        key: trivy-db-restore-${{ github.run_id }}
        restore-keys: trivy-db-
