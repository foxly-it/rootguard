name: Security Scans

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not just the checked-out commit - gitleaks scans
          # every commit for secrets that were later removed but still
          # live in history.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan git history for secrets
        run: gitleaks git --no-banner --config .gitleaks.toml .

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.73.0
      - name: Scan for vulnerabilities, secrets, and Dockerfile misconfigurations
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --ignorefile .trivyignore.yaml \
            --exit-code 1
          # trivy exits 0 regardless of findings unless --exit-code is set
          # explicitly - without it this job would always pass silently.

  go-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [rootguard-core, rootguard-updater, rootguard-webapp/backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
