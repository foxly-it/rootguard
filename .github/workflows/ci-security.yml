name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
  # workflow_call lets release-alpha.yml run these exact three jobs as
  # part of the release gate itself - found in review: a release cut
  # published images even though nothing in the release pipeline ever
  # actually waited on this workflow's result, only on it having run
  # *at some point* against main via the push trigger above (a separate,
  # untimed, unenforced signal). ref lets the caller pin the exact commit
  # to scan - release-alpha.yml's own source_ref, not the ambient
  # github.sha a workflow_dispatch run would otherwise resolve to.
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to scan (defaults to the calling run's own github.sha)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history, not just the checked-out commit - gitleaks scans
          # every commit for secrets that were later removed but still
          # live in history.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
      - name: Scan git history for secrets
        run: gitleaks git --no-banner --config .gitleaks.toml .

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install trivy
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz
          echo "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  trivy.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f trivy.tar.gz trivy
      - name: Scan for vulnerabilities, secrets, and Dockerfile misconfigurations
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --ignorefile .trivyignore.yaml \
            --exit-code 1
          # trivy exits 0 regardless of findings unless --exit-code is set
          # explicitly - without it this job would always pass silently.

  go-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [rootguard-core, rootguard-updater, rootguard-webapp/backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
