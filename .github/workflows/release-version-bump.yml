name: Cut next release

# Computes the next version, generates the changelog section for everything
# merged since the last tag, commits it, and explicitly dispatches
# release-alpha.yml's existing publish pipeline for it (unchanged itself).
# Manually triggered rather than automatic on every push to main: a human
# still decides *when* to cut a release, this only removes having to type
# or remember the next version number by hand.
#
# Does not create the release tag itself (a follow-up review's finding -
# see the "Commit the changelog" step's own comment for the full
# rationale): release-alpha.yml creates it, once, after every one of its
# own gates has actually passed.
#
# Defaults to incrementing the latest release tag's own trailing number
# (e.g. 0.1.0-beta.14 -> 0.1.0-beta.15). Pass the optional "version" input
# to override it for anything that isn't a bare increment - a base-version
# change (0.2.0, 1.0.0-rc.1, a bare 1.0.0), for instance. release-alpha.yml
# validates it's a real semantic version either way.
#
# GitHub Actions never auto-triggers another workflow's "on: push: tags"
# from a push made with the built-in GITHUB_TOKEN (an anti-recursion
# safeguard) - confirmed live: v0.1.0-alpha.9's tag push produced no
# release-alpha.yml run at all. Dispatching it explicitly with the computed
# version as input sidesteps that entirely, reusing the exact same
# workflow_dispatch path a maintainer already used by hand for every alpha
# release through v0.1.0-alpha.8.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version, e.g. 0.1.0-beta.2 (leave empty to auto-increment the current series)"
        required: false
        default: ""

# Shares its group name with release-alpha.yml deliberately - see that
# workflow's own concurrency block for why. Both workflows push to main;
# without a shared lock, this workflow's own changelog-commit push here
# could race with release-alpha.yml's update-alpha-pins job pushing a pin
# commit for an *earlier* dispatch that's still in flight.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  GIT_CLIFF_VERSION: "2.13.1"

jobs:
  version-and-changelog:
    runs-on: ubuntu-latest
    steps:
      # Found live: `main` requires 20 status checks on every push, not
      # just PR merges - the default GITHUB_TOKEN authenticates as the
      # "github-actions" app, which isn't a repository admin and so can't
      # bypass that, even with `contents: write`. `RELEASE_PAT` is a
      # fine-grained token scoped to this repo only (Contents: Read and
      # write), owned by an account that *does* have admin rights here -
      # admins bypass required status checks on a direct push
      # (`enforce_admins` is off), the same way a maintainer pushing this
      # exact commit by hand always could. Checking out with this token
      # instead of the default one means every git command in this job
      # (the "Commit the changelog" push below) authenticates as that
      # account instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine next version
        id: next
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Matches any RootGuard release tag, not just today's
          # "v0.1.0-(alpha|beta).N" scheme - sorted by actual tag creation
          # time (reliable regardless of version scheme, unlike trusting an
          # external API's own list order - see pickLatestReleaseImage's
          # own history for why that distinction matters), so this keeps
          # finding the right "latest" tag across a future base-version
          # change (0.2.0, 1.0.0-rc.1, a bare 1.0.0, ...) without further
          # changes here.
          latest_tag="$(git for-each-ref 'refs/tags/v*' --sort=-creatordate --format='%(refname:short)' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' | head -1 || true)"
          if [ -z "$latest_tag" ]; then
            echo "No existing release tag found" >&2
            exit 1
          fi
          if [ -n "$VERSION_OVERRIDE" ]; then
            next_version="$VERSION_OVERRIDE"
          else
            series="${latest_tag%.*}"
            latest_n="${latest_tag##*.}"
            next_n=$((latest_n + 1))
            next_version="${series#v}.${next_n}"
          fi
          # Validate *before* git-cliff, commit, tag, push, or GitHub
          # Release creation below - all of those already ran and had to
          # be manually cleaned up once, found in review, before this
          # check existed: only release-alpha.yml (dispatched last, as a
          # separate workflow run) validated the version, by which point
          # a typo'd override (1.0.0-rc.01, 1foo.2bar.3baz, 1.0.0+build)
          # had already produced a real commit on main, a real tag, and a
          # real GitHub Release that needed undoing by hand. require_semver
          # enforces the same SemVer 2.0 grammar as release-alpha.yml's own
          # gate - shared via scripts/lib/semver-validate.sh now instead of
          # a hand-kept duplicate, since this exact incident is what a
          # future silent drift between the two copies would risk again.
          source scripts/lib/semver-validate.sh
          require_semver "$next_version"
          if [ -z "$(git log "${latest_tag}"..HEAD --oneline)" ] && [ -z "$VERSION_OVERRIDE" ]; then
            echo "No commits since ${latest_tag} - nothing to release" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/v${next_version}" >/dev/null 2>&1; then
            echo "Tag v${next_version} already exists" >&2
            exit 1
          fi
          # Found in review: grammar validity (require_semver above)
          # says nothing about *ordering* - the auto-increment path above
          # always produces a genuinely higher version by construction,
          # but a hand-typed VERSION_OVERRIDE could name any valid,
          # unused SemVer string, including one with lower precedence
          # than what's already published (confirmed live: an override
          # of "0.9.9" against a real "1.0.0-rc.1" passed every other
          # check here). require_new_version enforces real SemVer 2.0
          # precedence (not sort -V, confirmed live to get this project's
          # own upcoming rc->stable transition backwards - see
          # semver-compare.sh's own comment), not just tag-string
          # inequality. The exact-same-version case can't reach this
          # point at all - already rejected above as "tag already
          # exists", since that's the same tag by construction whenever
          # next_version equals latest_tag's own version.
          source scripts/lib/semver-compare.sh
          require_new_version "$next_version" "${latest_tag#v}"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next_version}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        env:
          # Matches GIT_CLIFF_VERSION above - update together if that ever
          # changes (sha256sum of the .tar.gz asset for that version).
          GIT_CLIFF_SHA256: 9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546
        run: |
          set -euo pipefail
          curl -fsSL -o git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  git-cliff.tar.gz" | sha256sum -c -
          tar -xzf git-cliff.tar.gz "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          install "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate this release's changelog section
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --tag "${{ steps.next.outputs.tag }}" \
            "${{ steps.next.outputs.latest_tag }}..HEAD" --prepend CHANGELOG.md

      # Found in a follow-up review: this used to also create the release
      # tag right here, pointing at this changelog commit, before
      # release-alpha.yml (dispatched below) had run a single test against
      # it. release-alpha.yml's own update-alpha-pins job then *moved* that
      # pre-existing tag onto its later pin commit once everything passed
      # - which meant a tag existed, briefly, pointing at a commit nothing
      # had verified yet, and every subsequent run had to distinguish "the
      # legitimate first move" from "something redirected a published
      # reference", indistinguishably from the outside. No tag is created
      # here anymore at all: release-alpha.yml's update-alpha-pins job now
      # creates it exactly once, after every gate (test, security,
      # smoke-test, upgrade-test) has actually passed, directly on the
      # final pin commit - see that job's own "Point the release tag at
      # the pin-update commit" step.
      - name: Commit the changelog
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.next.outputs.version }}"
          git push origin HEAD:main
          # Recorded so the dispatched release-alpha.yml run below builds
          # from exactly this commit - found in review: dispatching with
          # only --ref main lets release-alpha.yml resolve its own
          # github.sha from whatever main happens to be *when that run's
          # checkout actually starts*, not necessarily this commit, if
          # anything else lands on main in between.
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The GitHub Release itself is *not* created here anymore - found in
      # review that this workflow used to create it right after tagging,
      # before release-alpha.yml (dispatched below) had even started, let
      # alone passed its smoke-test/upgrade-test gates. A failed upgrade
      # test still left a real, publicly visible GitHub Release behind,
      # needing manual cleanup - and since Core's/install.sh's live release
      # discovery both query the Releases API (not raw git tags), a
      # published-but-broken Release was also immediately eligible to be
      # auto-discovered as "latest" by any existing installation checking
      # for updates. release-alpha.yml's update-alpha-pins job creates the
      # Release now, gated behind both E2E tests actually passing (see its
      # own comment for the full rationale).
      - name: Dispatch the image-publishing release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-alpha.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version="${{ steps.next.outputs.version }}" \
            -f source_sha="${{ steps.commit.outputs.source_sha }}"
