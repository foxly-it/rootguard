name: Cut next release

# Computes the next version, generates the changelog section for everything
# merged since the last tag, pushes a new tag, and explicitly dispatches
# release-alpha.yml's existing publish pipeline for it (unchanged itself).
# Manually triggered rather than automatic on every push to main: a human
# still decides *when* to cut a release, this only removes having to type
# or remember the next version number by hand.
#
# Defaults to the next v0.1.0-alpha.N. Pass the optional "version" input to
# override it (e.g. 0.1.0-beta.1) for a series transition that isn't a bare
# alpha increment - release-alpha.yml itself gates on *-alpha.*/*-beta.* and
# will refuse anything else.
#
# GitHub Actions never auto-triggers another workflow's "on: push: tags"
# from a push made with the built-in GITHUB_TOKEN (an anti-recursion
# safeguard) - confirmed live: v0.1.0-alpha.9's tag push produced no
# release-alpha.yml run at all. Dispatching it explicitly with the computed
# version as input sidesteps that entirely, reusing the exact same
# workflow_dispatch path a maintainer already used by hand for every alpha
# release through v0.1.0-alpha.8.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version, e.g. 0.1.0-beta.1 (leave empty for the automatic next alpha)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

env:
  GIT_CLIFF_VERSION: "2.13.1"

jobs:
  version-and-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: next
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v0.1.0-alpha.*' | sort -t. -k4 -n | tail -1)"
          if [ -z "$latest_tag" ]; then
            echo "No existing v0.1.0-alpha.* tag found" >&2
            exit 1
          fi
          if [ -n "$VERSION_OVERRIDE" ]; then
            next_version="$VERSION_OVERRIDE"
          else
            latest_n="${latest_tag##*.}"
            next_n=$((latest_n + 1))
            next_version="0.1.0-alpha.${next_n}"
          fi
          if [ -z "$(git log "${latest_tag}"..HEAD --oneline)" ] && [ -z "$VERSION_OVERRIDE" ]; then
            echo "No commits since ${latest_tag} - nothing to release" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/v${next_version}" >/dev/null 2>&1; then
            echo "Tag v${next_version} already exists" >&2
            exit 1
          fi
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next_version}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        run: |
          set -euo pipefail
          curl -fsSL -o git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf git-cliff.tar.gz "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          install "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate this release's changelog section
        id: changelog
        run: |
          set -euo pipefail
          range="${{ steps.next.outputs.latest_tag }}..HEAD"
          git-cliff --config cliff.toml --tag "${{ steps.next.outputs.tag }}" \
            "$range" --strip header -o /tmp/release-notes.md
          git-cliff --config cliff.toml --tag "${{ steps.next.outputs.tag }}" \
            "$range" --prepend CHANGELOG.md

      - name: Commit changelog and tag the release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.next.outputs.version }}"
          git tag -a "${{ steps.next.outputs.tag }}" -m "${{ steps.next.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ steps.next.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.next.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.next.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --prerelease

      - name: Dispatch the image-publishing release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-alpha.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version="${{ steps.next.outputs.version }}"
