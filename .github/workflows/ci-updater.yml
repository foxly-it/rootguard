name: Updater CI

on:
  push:
    branches: [main]
    paths:
      - "rootguard-updater/**"
      - ".github/workflows/ci-updater.yml"
  pull_request:
    paths:
      - "rootguard-updater/**"
      - ".github/workflows/ci-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/foxly-it/rootguard-updater

jobs:
  # See ci-core.yml's identical job for the full rationale - this job id
  # ("test") used to collide with an identically-named, unrelated check
  # in two other workflows.
  test:
    name: Updater unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-updater/go.mod
          cache-dependency-path: rootguard-updater/go.sum
          cache: false
      - working-directory: rootguard-updater
        run: go test ./...
      - working-directory: rootguard-updater
        run: go vet ./...
      # See ci-core.yml's identical step for why - same gap, same fix.
      - working-directory: rootguard-updater
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted (run 'gofmt -w' on these):"
            echo "$unformatted"
            exit 1
          fi

  # See ci-blockpage.yml's identical job for the full rationale - this
  # job id ("build") used to collide with an identically-named,
  # unrelated check in two other workflows.
  build:
    name: Build and push updater image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: rootguard-updater
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run real paired update and rollback scenarios
        working-directory: rootguard-updater
        run: ./integration/run.sh
