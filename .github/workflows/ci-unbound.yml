name: Unbound CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "rootguard-unbound/**"
      - "rootguard-core/internal/unbound/**"
      - "rootguard-core/go.mod"
      - "rootguard-core/go.sum"
      - ".github/workflows/ci-unbound.yml"
  pull_request:
    paths:
      - "rootguard-unbound/**"
      - "rootguard-core/internal/unbound/**"
      - "rootguard-core/go.mod"
      - "rootguard-core/go.sum"
      - ".github/workflows/ci-unbound.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional RootGuard release tag for this image
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"   # Daily reproducibility and upstream-input check

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build validation image
        working-directory: rootguard-unbound
        run: docker build -t rootguard-unbound:test .

      - name: Validate Unbound configuration
        run: >-
          docker run --rm
          rootguard-unbound:test unbound-checkconf /etc/unbound/unbound.conf

      - name: Verify fixed hardening directives are baked into the image
        run: |
          docker run --rm --entrypoint cat rootguard-unbound:test /etc/unbound/unbound.conf > /tmp/unbound.conf
          for directive in \
            "harden-glue: yes" \
            "harden-dnssec-stripped: yes" \
            "harden-below-nxdomain: yes" \
            "aggressive-nsec: yes" \
            "hide-identity: yes" \
            "hide-version: yes" \
            "unwanted-reply-threshold: 10000000" \
            "minimal-responses: yes"; do
            grep -qF "$directive" /tmp/unbound.conf || { echo "missing: $directive"; exit 1; }
          done

      - name: Verify stable non-root identity
        run: |
          test "$(docker run --rm --entrypoint id rootguard-unbound:test -u unbound)" = "100"
          test "$(docker run --rm --entrypoint id rootguard-unbound:test -g unbound)" = "101"
          test "$(docker image inspect rootguard-unbound:test --format '{{.Config.User}}')" = "unbound"

      - name: Verify existing trust-anchor volume compatibility
        run: |
          docker volume create rootguard-unbound-upgrade-test
          docker run --rm \
            --user 0:0 \
            --volume rootguard-unbound-upgrade-test:/var/lib/unbound \
            --entrypoint /bin/sh \
            rootguard-unbound:test \
            -c 'cp /usr/share/dns/root.key /var/lib/unbound/root.key && chown -R 100:101 /var/lib/unbound'
          docker run --rm \
            --user unbound \
            --volume rootguard-unbound-upgrade-test:/var/lib/unbound \
            --entrypoint /bin/sh \
            rootguard-unbound:test \
            -c 'test -w /var/lib/unbound/root.key && touch /var/lib/unbound/root.key.compat'

      - name: Start resolver smoke-test container
        run: docker run --rm --detach --name rootguard-unbound-ci rootguard-unbound:test

      - name: Verify recursive DNS and DNSSEC
        run: |
          for attempt in {1..30}; do
            if test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' rootguard-unbound-ci)" = "healthy"; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' rootguard-unbound-ci)" = "healthy"
          valid="$(docker exec rootguard-unbound-ci dig @127.0.0.1 -p 5335 example.com A +dnssec +time=3 +tries=1)"
          grep -Eq 'flags:.* ad[ ;]' <<<"$valid"
          broken="$(docker exec rootguard-unbound-ci dig @127.0.0.1 -p 5335 dnssec-failed.org A +time=3 +tries=1)"
          grep -q 'status: SERVFAIL' <<<"$broken"
          # hide-identity/hide-version: these CHAOS-class probes are how a
          # scanner fingerprints the resolver software/version to target
          # known exploits - both must come back empty.
          identity="$(docker exec rootguard-unbound-ci dig @127.0.0.1 -p 5335 CH TXT id.server +short +time=3 +tries=1)"
          test -z "$identity"
          version="$(docker exec rootguard-unbound-ci dig @127.0.0.1 -p 5335 CH TXT version.server +short +time=3 +tries=1)"
          test -z "$version"
          docker exec rootguard-unbound-ci unbound-control status
          docker exec rootguard-unbound-ci unbound-control verbosity 2
          test "$(docker exec rootguard-unbound-ci unbound-control status | awk '/^verbosity:/ {print $2}')" = "2"
          docker exec rootguard-unbound-ci unbound-control verbosity 0
          test "$(docker exec rootguard-unbound-ci unbound-control status | awk '/^verbosity:/ {print $2}')" = "0"
          test -z "$(docker image inspect rootguard-unbound:test --format '{{json .Config.ExposedPorts}}' | grep 8953 || true)"

      - name: Stop resolver smoke-test container
        if: always()
        run: |
          docker stop rootguard-unbound-ci || true
          docker volume rm rootguard-unbound-upgrade-test || true

      - name: Verify secure Unbound version
        run: |
          VERSION="$(docker run --rm --entrypoint unbound rootguard-unbound:test -V 2>&1 | awk '/^Version / {print $2; exit}')"
          test "$VERSION" = "1.25.2"
          test "$(docker image inspect rootguard-unbound:test --format '{{index .Config.Labels "io.rootguard.unbound.source.sha256"}}')" = "0d92275c703d5f5f8baba3dab22117dd8c29b495588a5c229768ed6581566600"
          test "$(docker image inspect rootguard-unbound:test --format '{{index .Config.Labels "io.rootguard.base.digest"}}')" = "sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd"
          echo "Validated upstream Unbound: $VERSION"

  # Exercises the real guided-settings render path (Settings.Render, exactly
  # what a user's WebGUI configuration produces) against a live resolver -
  # home network, VLANs, split DNS, IPv6-only local records, a broken
  # forward-zone upstream, and DNSSEC failures under a non-trivial guided
  # config, not just the fixed base image the `test` job above covers.
  # amd64 only: these scenarios exercise configuration/resolution logic, not
  # architecture-specific binary behavior, so a second native arm64 runner
  # wouldn't add real coverage - doubling this job's cost for no signal.
  scenario-tests:
    name: Guided-settings scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build validation image
        working-directory: rootguard-unbound
        run: docker build -t rootguard-unbound:test .

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rootguard-core/go.mod

      - name: Run scenario tests
        working-directory: rootguard-core
        run: go test -tags integration ./internal/unbound/... -run TestScenario -v

  # Runs only after both native amd64 and arm64 legs of `test` pass, plus
  # the guided-settings scenario tests - the multi-arch image built and
  # pushed here previously went out with only amd64 ever having run
  # unbound-checkconf, the DNSSEC/identity/version smoke tests, or the
  # trust-anchor compatibility check against it; arm64 was built and
  # shipped on trust alone. `needs` closes that gap, now including a
  # guided-settings regression as a publish blocker too.
  build-push:
    name: Build and push multi-arch image
    needs: [test, scenario-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract installed Unbound version
        id: version
        working-directory: rootguard-unbound
        run: |
          docker build -t rootguard-unbound:versioncheck .
          VERSION="$(docker run --rm --entrypoint unbound rootguard-unbound:versioncheck -V 2>&1 | awk '/^Version / {print $2; exit}')"
          MAJORMINOR="$(echo "$VERSION" | cut -d'.' -f1,2)"
          echo "Detected upstream version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "majorminor=$MAJORMINOR" >> "$GITHUB_OUTPUT"

      - name: Determine build timestamp
        id: build-time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # 🏗 Build & Push Multi-Arch Image
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: rootguard-unbound
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rootguard-unbound:latest
            ghcr.io/${{ github.repository_owner }}/rootguard-unbound:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/rootguard-unbound:${{ steps.version.outputs.majorminor }}
            ${{ inputs.release_tag != '' && format('ghcr.io/{0}/rootguard-unbound:{1}', github.repository_owner, inputs.release_tag) || '' }}
          build-args: |
            COMMIT=${{ github.sha }}
            CREATED=${{ steps.build-time.outputs.value }}
