name: WebApp CI

on:
  push:
    branches:
      - main
    paths:
      - "rootguard-webapp/**"
      - ".github/workflows/ci-webapp.yml"
  pull_request:
    paths:
      - "rootguard-webapp/**"
      - ".github/workflows/ci-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: foxly-it/rootguard-webapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: rootguard-webapp/backend/go.mod
          cache-dependency-path: rootguard-webapp/backend/go.sum

      - name: Test backend
        working-directory: rootguard-webapp/backend
        run: go test ./...

      - name: Vet backend
        working-directory: rootguard-webapp/backend
        run: go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rootguard-webapp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: rootguard-webapp/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: rootguard-webapp/frontend
        run: npm audit --audit-level=high

      - name: Lint frontend
        working-directory: rootguard-webapp/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: rootguard-webapp/frontend
        run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: rootguard-webapp
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Attest published image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
