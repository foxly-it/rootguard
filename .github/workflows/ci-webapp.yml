name: WebApp CI

on:
  push:
    branches:
      - main
    paths:
      - "rootguard-webapp/**"
      - ".github/workflows/ci-webapp.yml"
  # No paths filter on pull_request - see ci-core.yml's identical
  # comment for the full rationale: "WebApp backend and frontend tests"
  # is a required branch-protection status check, and a path filter here
  # meant a PR that never touched rootguard-webapp/** never got this
  # check at all, leaving GitHub waiting forever for one that would
  # never report.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: foxly-it/rootguard-webapp

jobs:
  # See ci-core.yml's identical job for the full rationale - this job id
  # ("test") used to collide with an identically-named, unrelated check
  # in two other workflows.
  test:
    name: WebApp backend and frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See ci-blockpage.yml's identical check for the full rationale -
      # added on both sides so a drift introduced from either component's
      # own PR fails loudly here instead of silently going unnoticed.
      - name: Check theme.js stays in sync with the real blockpage's copy
        run: diff rootguard-blockpage/web/theme.js rootguard-webapp/frontend/public/blockpage-preview/theme.js

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-webapp/backend/go.mod
          cache-dependency-path: rootguard-webapp/backend/go.sum

      - name: Test backend
        working-directory: rootguard-webapp/backend
        run: go test ./...

      - name: Vet backend
        working-directory: rootguard-webapp/backend
        run: go vet ./...

      # See ci-core.yml's identical step for why - same gap, same fix.
      - name: Check backend formatting
        working-directory: rootguard-webapp/backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted (run 'gofmt -w' on these):"
            echo "$unformatted"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rootguard-webapp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: rootguard-webapp/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: rootguard-webapp/frontend
        run: npm audit --audit-level=high

      - name: Lint frontend
        working-directory: rootguard-webapp/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: rootguard-webapp/frontend
        run: npm test

      - name: Build frontend
        working-directory: rootguard-webapp/frontend
        run: npm run build

      # See ci-updater.yml's identical step for why this job needs its
      # own single-platform local build rather than reusing the `build`
      # job's multi-arch buildx one.
      - name: Build image for scanning
        working-directory: rootguard-webapp
        run: docker build -t rootguard-webapp:test .

      # See ci-core.yml's identical step for the full gap this closes.
      - name: Scan image for vulnerabilities
        run: ./scripts/ci/trivy-image-scan.sh rootguard-webapp:test

  # See ci-blockpage.yml's identical job for the full rationale - this
  # job id ("build") used to collide with an identically-named,
  # unrelated check in two other workflows.
  build:
    name: Build and push webapp image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: rootguard-webapp
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Attest published image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
