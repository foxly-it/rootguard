name: Blockpage CI

on:
  push:
    branches:
      - main
    paths:
      - "rootguard-blockpage/**"
      - ".github/workflows/ci-blockpage.yml"
      - "scripts/ci/trivy-image-scan.sh"
      - "scripts/ci/trivy-version.env"
      - ".trivyignore.yaml"
  # No paths filter on pull_request, unlike push above - found in review,
  # round 15: "Build and push blockpage image" carries the only image
  # scan for Blockpage that runs on every PR (ci-blockpage.yml's own
  # `Scan image for vulnerabilities` step, round 14) but wasn't a
  # required branch-protection check, and the round-14 paths filter here
  # meant a PR that never touched rootguard-blockpage/** wouldn't even
  # produce the check to require in the first place - a Blockpage PR
  # with a genuinely failing scan could still merge. Same fix already
  # applied to ci-core.yml/ci-updater.yml/ci-webapp.yml/ci-unbound.yml in
  # round 10/11, for the identical reason.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: foxly-it/rootguard-blockpage

jobs:
  # Found in review: this job id ("build") is identical across
  # ci-blockpage.yml, ci-updater.yml, and ci-webapp.yml, each producing
  # an unnamed check run literally called "build" - see ci-core.yml's
  # own "test" job for the identical class of finding.
  build:
    name: Build and push blockpage image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # web/theme.js is deliberately duplicated, byte-for-byte, at
      # rootguard-webapp/frontend/public/blockpage-preview/theme.js (the
      # webapp's own in-app preview of the real blockpage) rather than
      # built from one shared source - found in review as a low-priority
      # drift risk, not a bug (both copies were, and still are, correct).
      # This check exists purely so a future edit to one side without the
      # other fails loudly here instead of silently drifting unnoticed.
      - name: Check theme.js stays in sync with its webapp preview copy
        run: diff rootguard-blockpage/web/theme.js rootguard-webapp/frontend/public/blockpage-preview/theme.js

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: rootguard-blockpage
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci

      # Found in review, round 14: this is one of the two published
      # images (Unbound is the other, see ci-unbound.yml) that
      # trivy-image-scan.sh (round 13) never covered - see
      # trivy-image-scan.sh's own header comment for the full gap this
      # closes.
      - name: Scan image for vulnerabilities
        run: ./scripts/ci/trivy-image-scan.sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci

      - name: Verify the page serves and enforces its security headers
        run: |
          docker run -d --name blockpage-ci -p 18080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/info/)" = "200"
          test -n "$(curl --silent http://127.0.0.1:18080/clientip.txt)"
          headers="$(curl --silent --head http://127.0.0.1:18080/)"
          echo "$headers" | grep -qi "^x-frame-options: sameorigin"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
          echo "$headers" | grep -qi "^content-security-policy:"
          docker rm -f blockpage-ci

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: rootguard-blockpage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
