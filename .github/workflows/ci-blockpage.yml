name: Blockpage CI

on:
  push:
    branches:
      - main
    paths:
      - "rootguard-blockpage/**"
      - ".github/workflows/ci-blockpage.yml"
  pull_request:
    paths:
      - "rootguard-blockpage/**"
      - ".github/workflows/ci-blockpage.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: foxly-it/rootguard-blockpage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: rootguard-blockpage
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci

      - name: Verify the page serves and enforces its security headers
        run: |
          docker run -d --name blockpage-ci -p 18080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/info/)" = "200"
          test -n "$(curl --silent http://127.0.0.1:18080/clientip.txt)"
          headers="$(curl --silent --head http://127.0.0.1:18080/)"
          echo "$headers" | grep -qi "^x-frame-options: sameorigin"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
          echo "$headers" | grep -qi "^content-security-policy:"
          docker rm -f blockpage-ci

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: rootguard-blockpage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
