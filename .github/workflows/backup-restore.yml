name: Backup and restore

on:
  pull_request:
    paths:
      - "compose.release.yaml"
      - ".env.release.example"
      - "scripts/verify-backup-restore.sh"
      - "scripts/verification-common.sh"
      - ".github/workflows/backup-restore.yml"
      - "rootguard-core/**"
      - "rootguard-webapp/**"
  push:
    branches: [main]
    paths:
      - "compose.release.yaml"
      - ".env.release.example"
      - "scripts/verify-backup-restore.sh"
      - "scripts/verification-common.sh"
      - ".github/workflows/backup-restore.yml"
      - "rootguard-core/**"
      - "rootguard-webapp/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Found in review: this job id/name pair ("linux" / "Linux
  # ${{ matrix.arch }}") is identical to clean-install.yml's own job -
  # both produce a check literally named "Linux amd64"/"Linux arm64",
  # indistinguishable from each other in the Checks UI, in gh pr checks
  # output, or as a required-status-check entry.
  linux:
    name: Backup and restore, Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install DNS test client
        run: |
          sudo apt-get update
          sudo apt-get install --yes dnsutils

      # Backup/restore logic lives in both rootguard-core (backupexport,
      # backuprestore, installer) and rootguard-webapp (the HTTP proxy and
      # multipart handling for it) - building both from this checkout,
      # rather than letting the test fall through to the pinned published
      # images, is what makes this job actually test the pull request
      # instead of just re-testing the last release on every run.
      - name: Build rootguard-core from this checkout
        run: docker build -t rootguard-core:e2e ./rootguard-core

      - name: Build rootguard-webapp from this checkout
        run: docker build -t rootguard-webapp:e2e ./rootguard-webapp

      # See verification-common.sh's own comment on verify_dns - a real
      # internet domain here would fail this job on a transient DNS
      # hiccup unrelated to the code under test.
      - name: Start local DNSSEC test authority
        run: ./scripts/ci/dnssec-test-zone/setup.sh

      - name: Verify backup export and restore
        env:
          ROOTGUARD_TEST_ARCH: ${{ matrix.arch }}
          ROOTGUARD_CORE_IMAGE: rootguard-core:e2e
          ROOTGUARD_WEBAPP_IMAGE: rootguard-webapp:e2e
          ROOTGUARD_VERIFY_DNS_DOMAIN: good.rgtest-ci.internal
          ROOTGUARD_VERIFY_DNS_DNSSEC_FAIL_DOMAIN: bad.rgtest-ci.internal
          # This job builds rootguard-core (and, when BlockpageEnabled,
          # would deploy Unbound/Blockpage) from this checkout - none of
          # that carries a real cosign attestation, so the installer's
          # attestation gate (see cmd/rootguard/main.go) would otherwise
          # fail every deploy here. See ROOTGUARD_SKIP_ATTESTATION's own
          # doc comment there for what it disables and why.
          ROOTGUARD_SKIP_ATTESTATION: "true"
        run: ./scripts/verify-backup-restore.sh

      - name: Record platform evidence
        if: always()
        run: |
          {
            echo "### Linux ${{ matrix.arch }}"
            echo
            echo "- Runner: \`${{ matrix.runner }}\`"
            echo "- Docker architecture: \`$(docker info --format '{{.Architecture}}')\`"
            echo "- Docker Engine: \`$(docker version --format '{{.Server.Version}}')\`"
            echo "- Docker Compose: \`$(docker compose version --short)\`"
          } >> "$GITHUB_STEP_SUMMARY"
