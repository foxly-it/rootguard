name: Package pin freshness

# Debian only ever serves the latest point release of a package - any
# exact-pinned version in rootguard-unbound/Dockerfile WILL eventually go
# stale the moment that package gets a routine security update, taking the
# old pinned version down with it entirely. Confirmed live: a
# libexpat1/libexpat1-dev security bump silently broke the scheduled
# Unbound CI build with a bare apt error, easy to miss in a full 20-minute
# build log until someone happened to notice. This runs the same check
# scripts/check-debian-pins.sh does on demand, but proactively and daily,
# well ahead of the next scheduled Unbound CI build, and opens a PR with
# the fix already applied instead of leaving a cryptic failure for someone
# to decode.
#
# Since #712 the same run also covers the exact `apk add` pins in Core,
# Updater and Blockpage (scripts/check-alpine-pins.sh) - Alpine's mirrors
# drop superseded builds the same way. Both checkers share one exit-code
# contract and feed one PR. (File name kept for existing references.)

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# Found in review: guards against two runs overlapping (a manual dispatch
# during the daily cron window, say) both trying to push to/open the same
# fix PR.
concurrency:
  group: debian-pin-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-fix:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The push token only reaches git push/gh below - never persisted
          # in .git/config, and stripped from check-debian-pins.sh's env.
          persist-credentials: false

      - name: Check pinned Debian and Alpine packages
        id: check
        run: |
          set +e
          debian="$(./scripts/check-debian-pins.sh 2>&1)"
          debian_code=$?
          alpine="$(./scripts/check-alpine-pins.sh 2>&1)"
          alpine_code=$?
          set -e
          report="$(printf '%s\n\n%s' "$debian" "$alpine")"
          # Worst result wins: any operational/unfixable code over drift (1).
          exit_code=$(( debian_code > alpine_code ? debian_code : alpine_code ))
          echo "$report"
          {
            echo "report<<PINEOF"
            echo "$report"
            echo "PINEOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 1 ]; then
            echo "::error::Pin check failed operationally (exit ${exit_code}); refusing to run --fix"
            exit "$exit_code"
          fi
          if [ "$exit_code" -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      # Reuses one deterministic branch, force-pushed, rather than opening
      # a new PR on every drifted run before a human gets to review the
      # last one - the same convention dependabot itself uses.
      #
      # Found live, 2026-10-04 (#697): pushes and PRs made with GITHUB_TOKEN
      # never trigger workflows, so #689's checks all sat in
      # `action_required` while main's Unbound CI stayed red. PIN_REFRESH_TOKEN
      # (fine-grained PAT, this repo only, Contents + Pull requests: read and
      # write) makes the PR's CI run. Deliberately not RELEASE_PAT: that one
      # lacks Pull requests: write and is the admin-owned token for release
      # pushes to main, which has no business in a daily cron job.
      - name: Apply the fix and open or update a PR
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIN_REFRESH_TOKEN || github.token }}
          HAS_PIN_REFRESH_TOKEN: ${{ secrets.PIN_REFRESH_TOKEN != '' }}
          DRIFT_REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -euo pipefail
          if [ "$HAS_PIN_REFRESH_TOKEN" != "true" ]; then
            echo "::warning::PIN_REFRESH_TOKEN is not set - falling back to GITHUB_TOKEN, so CI on the fix PR won't start until each workflow run is approved by hand"
          fi
          env -u GH_TOKEN ./scripts/check-debian-pins.sh --fix
          env -u GH_TOKEN ./scripts/check-alpine-pins.sh --fix
          dockerfiles=(rootguard-unbound/Dockerfile rootguard-core/Dockerfile rootguard-updater/Dockerfile rootguard-blockpage/Dockerfile)
          if git diff --quiet -- "${dockerfiles[@]}"; then
            echo "Repository changed while checking; no stale pins remain and no PR is needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/debian-pin-refresh"
          git checkout -B "$branch"
          git add -- "${dockerfiles[@]}"
          git commit -m "chore: refresh drifted package pins" -m "${DRIFT_REPORT}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $branch, force-push updated it"
          else
            gh pr create --title "chore: refresh drifted package pins" \
              --body "Opened automatically by the package pin freshness workflow - one or more exact-pinned Debian (\`rootguard-unbound\`) or Alpine (\`rootguard-core\`, \`rootguard-updater\`, \`rootguard-blockpage\`) package versions are no longer the newest build their pinned base image's repository serves; mirrors drop superseded builds, so the old pin stops installing. Merge once CI is green." \
              --head "$branch" --base main
          fi
