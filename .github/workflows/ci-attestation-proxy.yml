name: Attestation Proxy CI

on:
  push:
    branches: [main]
    paths:
      - "rootguard-attestation-proxy/**"
      - ".github/workflows/ci-attestation-proxy.yml"
      # See ci-core.yml's identical comment for why.
      - "scripts/ci/trivy-image-scan.sh"
      - "scripts/ci/install-trivy.sh"
      - "scripts/ci/trivy-version.env"
      - ".trivyignore.yaml"
  # No paths filter on pull_request - see ci-core.yml's identical
  # comment for the full rationale: a required branch-protection status
  # check must run on every PR, not just ones that happen to touch this
  # component's own path, or GitHub waits forever for one that would
  # never report.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

# Found in review: repeated pushes to the same PR used to stack full runs
# instead of superseding the stale one.
concurrency:
  group: ci-attestation-proxy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/foxly-it/rootguard-attestation-proxy

jobs:
  test:
    name: Attestation proxy unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-attestation-proxy/go.mod
          # Found in review: cache: false with no cache-dependency-path was
          # undocumented and inconsistent with every other Go component in
          # this repo (see ci-core.yml, ci-webapp.yml, ci-unbound.yml),
          # which all cache the module download.
          cache-dependency-path: rootguard-attestation-proxy/go.sum
      - working-directory: rootguard-attestation-proxy
        run: go test ./...
      - working-directory: rootguard-attestation-proxy
        run: go vet ./...
      - working-directory: rootguard-attestation-proxy
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted (run 'gofmt -w' on these):"
            echo "$unformatted"
            exit 1
          fi
      # Same reasoning as ci-updater.yml's identical step: the `build`
      # job below only ever produces a pushed multi-arch manifest, which
      # can't be `--load`ed into the local daemon to scan - a real,
      # single-platform, locally loaded build lives here purely to give
      # trivy something to scan.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # See ci-core.yml's identical step for the full rationale.
      - working-directory: rootguard-attestation-proxy
        run: docker buildx build --load --cache-from type=gha,scope=attestation-proxy --cache-to type=gha,mode=max,scope=attestation-proxy -t rootguard-attestation-proxy:test .
      - run: ./scripts/ci/trivy-image-scan.sh rootguard-attestation-proxy:test

  build:
    name: Build and push attestation proxy image
    timeout-minutes: 20
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: rootguard-attestation-proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=attestation-proxy
          cache-to: type=gha,mode=max,scope=attestation-proxy
