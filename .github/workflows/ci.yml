name: RootGuard Integration CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ROOTGUARD_API_TOKEN: ci-rootguard-token-not-a-real-secret-32
      ROOTGUARD_ADMIN_USER: admin
      ROOTGUARD_ADMIN_PASSWORD: ci-rootguard-password
      ROOTGUARD_RECOVERY_TOKEN: ci-rootguard-recovery-token-not-a-real-secret-32
      ROOTGUARD_WEB_PORT: "18080"
      ROOTGUARD_DNS_BIND: 127.0.0.1
      ROOTGUARD_DNS_PORT: "1053"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test verification-common.sh's resource-ownership state machine
        run: ./scripts/verification-common.test.sh

      # Found in review, round 6: the release-version SemVer guard shipped
      # with no automated regression coverage - this is that coverage.
      - name: Test semver-compare.sh's SemVer 2.0 precedence rules
        run: ./scripts/lib/semver-compare.test.sh

      # Found in review, round 7: release-alpha.yml's release-retry
      # detection had two real bugs (an unreachable retry branch, and a
      # content-diff check that could resolve to an unrelated commit) -
      # this exercises the fix against synthetic git histories for every
      # scenario the review named, not just the two it happened to spot.
      - name: Test resolve-release-pin-commit.sh's retry detection
        run: ./scripts/lib/resolve-release-pin-commit.test.sh

      # Found in review: check-site-facts.sh already checks this for
      # site/*.html, but nothing checked it repo-wide - PR #423 deleted
      # the per-component SECURITY.md files on the reasoning that nothing
      # linked to them, verified with a narrow grep for those specific
      # paths only; at least eight README.md/CONTRIBUTING.md files turned
      # out to link to their own now-deleted copy and nothing caught it.
      #
      # Found in review, round 6: the hand-rolled regex checker this used
      # to run (scripts/check-markdown-links.sh) only ever matched a single
      # inline-link shape (`](target)`) - it missed reference-style links
      # (`[text][id]`), link reference definitions (`[id]: target`), `<...>`
      # targets, optional link titles, and non-standard code-fence markers
      # (`~~~`, indented or longer backtick fences) that a real CommonMark
      # parser handles correctly. lychee is one. No broken link of any of
      # those shapes exists in this repo today, but the check itself was
      # incomplete. --offline: local file links only, no network requests
      # - a CI check shouldn't depend on third-party sites being reachable.
      # Same version-pinned-and-checksummed install pattern release-alpha.yml
      # already uses for git-cliff.
      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          curl -fsSL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz "lychee-x86_64-unknown-linux-gnu/lychee"
          install "lychee-x86_64-unknown-linux-gnu/lychee" /usr/local/bin/lychee

      - name: Check local markdown links repo-wide
        run: |
          set -euo pipefail
          git ls-files -z -- '*.md' | xargs -0 lychee --offline --no-progress

      - name: Validate Compose model
        run: docker compose -f compose.integration.yaml config --quiet

      - name: Validate public release Compose model
        run: |
          docker compose -f compose.release.yaml config --quiet
          model="$(docker compose -f compose.release.yaml config --format json)"
          test "$(jq -r 'any(.services[]; has("build"))' <<<"$model")" = false
          test "$(jq -r '[.services[].image, .services.core.environment.ROOTGUARD_UNBOUND_IMAGE, .services.core.environment.ROOTGUARD_ADGUARD_IMAGE, .services.core.environment.ROOTGUARD_ADGUARD_BETA_IMAGE, .services.core.environment.ROOTGUARD_UNBOUND_UPDATE_IMAGE, .services.core.environment.ROOTGUARD_ADGUARD_UPDATE_IMAGE, .services.core.environment.ROOTGUARD_BLOCKPAGE_IMAGE, .services.updater.environment.ROOTGUARD_CORE_UPDATE_IMAGE, .services.updater.environment.ROOTGUARD_WEBAPP_UPDATE_IMAGE] | all(contains("@sha256:"))' <<<"$model")" = true
          test "$(jq -r '[.services[].image] | any(test("(^|:)latest(@|$)"))' <<<"$model")" = false

      - name: Build RootGuard stack
        run: docker compose -f compose.integration.yaml build

      - name: Start RootGuard stack
        run: docker compose -f compose.integration.yaml up -d

      - name: Wait for WebApp
        run: |
          for attempt in {1..60}; do
            login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie-jar /tmp/rootguard-ci-cookies.txt \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"ci-rootguard-password"}' \
              http://127.0.0.1:18080/api/auth/login || true)"
            if test "$login_status" = "200"; then
              if curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/version >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1

      - name: Bootstrap AdGuard Home
        run: |
          curl --fail --show-error --silent \
            --cookie /tmp/rootguard-ci-cookies.txt \
            --request POST \
            http://127.0.0.1:18080/api/adguard/bootstrap

      - name: Verify control-plane updater wiring
        run: |
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            --request POST http://127.0.0.1:18080/api/control-plane-updates/check >/dev/null
          for attempt in {1..30}; do
            status="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
              http://127.0.0.1:18080/api/control-plane-updates)"
            if test "$(jq -r .state <<<"$status")" = "idle"; then
              test "$(jq '.services | length' <<<"$status")" = "2"
              test "$(jq '[.services[].update_available] | any' <<<"$status")" = "false"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify Unbound configuration lifecycle
        run: |
          presets="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/presets)"
          preset_count="$(jq 'length' <<<"$presets")"
          test "$preset_count" = "4" || { echo "Expected 4 presets, received $preset_count"; exit 1; }
          active="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/settings)"
          active_profile="$(jq -r .resource_profile <<<"$active")"
          test "$active_profile" = "medium" || { echo "Expected default resource profile medium, received $active_profile"; exit 1; }
          risky="$(jq '.qname_minimisation = false | .prefetch = false | .serve_expired = false | .cache_min_ttl = 600 | .cache_max_ttl = 604800 | .threads = 16' <<<"$active")"
          advice="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' --data "$risky" http://127.0.0.1:18080/api/unbound/advice)"
          advice_status="$(jq -r .status <<<"$advice")"
          recommendation_count="$(jq '.recommendations | length' <<<"$advice")"
          test "$advice_status" = "review" || { echo "Expected advisor review status, received $advice_status"; exit 1; }
          test "$recommendation_count" -ge 4 || { echo "Expected at least 4 recommendations, received $recommendation_count"; exit 1; }
          test "$(jq -r '.serve_expired_ttl' <<<"$active")" = "86400" || { echo "Expected default serve-expired TTL of 86400 seconds"; exit 1; }
          test "$(jq -r '.serve_expired_client_timeout' <<<"$active")" = "1800" || { echo "Expected default serve-expired client timeout of 1800 milliseconds"; exit 1; }
          test "$(jq -r '.prefetch_key' <<<"$active")" = "true" || { echo "Expected Prefetch Key to be enabled by default"; exit 1; }
          test "$(jq -r '.aggressive_nsec' <<<"$active")" = "true" || { echo "Expected aggressive NSEC to be enabled by default"; exit 1; }
          test "$(jq -r '.edns_buffer_size' <<<"$active")" = "1232" || { echo "Expected EDNS buffer size default of 1232 bytes"; exit 1; }
          test "$(jq -r '.log_verbosity' <<<"$active")" = "1" || { echo "Expected privacy-safe operational logging level 1 by default"; exit 1; }
          proposal="$(jq '.qname_minimisation = true | .prefetch = true | .prefetch_key = false | .aggressive_nsec = false | .edns_buffer_size = 1400 | .log_verbosity = 0 | .serve_expired = true | .serve_expired_ttl = 172800 | .serve_expired_client_timeout = 1200 | .cache_min_ttl = 120 | .cache_max_ttl = 86400 | .threads = 4 | .resource_profile = "large"' <<<"$active")"
          preview="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' --data "$proposal" http://127.0.0.1:18080/api/unbound/preview)"
          preview_changed="$(jq -r .changed <<<"$preview")"
          cache_profile_rendered="$(jq -r '.rendered_config | contains("rrset-cache-size: 128m") and contains("msg-cache-size: 64m")' <<<"$preview")"
          serve_expired_rendered="$(jq -r '.rendered_config | contains("serve-expired-ttl: 172800") and contains("serve-expired-client-timeout: 1200")' <<<"$preview")"
          dnssec_cache_rendered="$(jq -r '.rendered_config | contains("prefetch-key: no") and contains("aggressive-nsec: no")' <<<"$preview")"
          edns_buffer_rendered="$(jq -r '.rendered_config | contains("edns-buffer-size: 1400")' <<<"$preview")"
          safe_logging_rendered="$(jq -r '.rendered_config | contains("verbosity: 0") and contains("log-queries: no") and contains("log-replies: no")' <<<"$preview")"
          test "$preview_changed" = "true" || { echo "Expected changed preview, received $preview_changed"; exit 1; }
          test "$cache_profile_rendered" = "true" || { echo "Expected large cache directives in preview, received $cache_profile_rendered"; exit 1; }
          test "$serve_expired_rendered" = "true" || { echo "Expected serve-expired timing directives in preview, received $serve_expired_rendered"; exit 1; }
          test "$dnssec_cache_rendered" = "true" || { echo "Expected DNSSEC cache directives in preview, received $dnssec_cache_rendered"; exit 1; }
          test "$edns_buffer_rendered" = "true" || { echo "Expected EDNS buffer size directive in preview, received $edns_buffer_rendered"; exit 1; }
          test "$safe_logging_rendered" = "true" || { echo "Expected privacy-safe logging directives in preview, received $safe_logging_rendered"; exit 1; }
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request PUT --header 'Content-Type: application/json' --data "$proposal" http://127.0.0.1:18080/api/unbound/settings >/dev/null
          diagnostic_logging="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request POST http://127.0.0.1:18080/api/unbound/diagnostic-logging)"
          test "$(jq -r '.active' <<<"$diagnostic_logging")" = "true" || { echo "Expected temporary diagnostic logging to be active"; exit 1; }
          test "$(jq -r '.level' <<<"$diagnostic_logging")" = "2" || { echo "Expected temporary diagnostic logging level 2"; exit 1; }
          restored_logging="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request DELETE http://127.0.0.1:18080/api/unbound/diagnostic-logging)"
          test "$(jq -r '.active' <<<"$restored_logging")" = "false" || { echo "Expected temporary diagnostic logging to stop"; exit 1; }
          test "$(jq -r '.level' <<<"$restored_logging")" = "0" || { echo "Expected privacy-safe logging level 0 after stopping diagnostics"; exit 1; }
          versions="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/history)"
          test "$(jq 'length' <<<"$versions")" -ge 2
          baseline_id="$(jq -r '.[] | select(.settings.threads == 2) | .id' <<<"$versions")"
          diagnostics="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/diagnostics)"
          test "$(jq -r .healthy <<<"$diagnostics")" = "true"
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request POST "http://127.0.0.1:18080/api/unbound/history/$baseline_id/restore" >/dev/null
          test "$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/settings | jq -r .threads)" = "2"

      - name: Verify DNS through AdGuard and Unbound
        run: |
          answer="$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1053 example.com A)"
          test -n "$answer"
          status="$(dig +dnssec +time=5 +tries=2 @127.0.0.1 -p 1053 dnssec-failed.org A | sed -n 's/^;; ->>HEADER<<- opcode: QUERY, status: \([^,]*\).*/\1/p')"
          test "$status" = "SERVFAIL"

      - name: Verify Unbound expert configuration lifecycle
        run: |
          test "$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/directives | jq 'length')" -ge 15
          custom=$'server:\n    local-zone: "home.arpa." static\n    local-data: "router.home.arpa. 300 IN A 192.168.1.1"\n'
          payload="$(jq -n --arg content "$custom" '{content:$content}')"
          preview="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' --data "$payload" http://127.0.0.1:18080/api/unbound/custom/preview)"
          test "$(jq -r .changed <<<"$preview")" = "true"
          test -n "$(jq -r .validation <<<"$preview")"
          forbidden="$(jq -n --arg content 'include: "/etc/passwd"' '{content:$content}')"
          http_status="$(curl --silent --output /tmp/custom-error.json --write-out '%{http_code}' --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' --data "$forbidden" http://127.0.0.1:18080/api/unbound/custom/preview)"
          test "$http_status" = "400"
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request PUT --header 'Content-Type: application/json' --data "$payload" http://127.0.0.1:18080/api/unbound/custom >/dev/null
          test "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1053 router.home.arpa A)" = "192.168.1.1"
          versions="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/history)"
          custom_id="$(jq -r --arg content "$custom" '.[] | select(.custom_config == $content) | .id' <<<"$versions" | head -1)"
          test -n "$custom_id"
          baseline_id="$(jq -r '.[] | select((.custom_config // "") == "") | .id' <<<"$versions" | head -1)"
          test -n "$baseline_id"
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request POST "http://127.0.0.1:18080/api/unbound/history/$baseline_id/restore" >/dev/null
          test "$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/custom | jq -r .content)" = ""

      - name: Verify guided conditional forwarding lifecycle
        run: |
          set -x
          active="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/settings)"
          test "$(jq '.forward_zones | length' <<<"$active")" = "0"
          zones='[{"name":"example.","servers":["172.30.54.2"],"forward_first":false,"allow_unsigned":true,"allow_private_addresses":true}]'
          checks="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --argjson zones "$zones" '{zones:$zones}')" \
            http://127.0.0.1:18080/api/unbound/forward-check)"
          test "$(jq 'length' <<<"$checks")" = "1"
          test "$(jq -r '.[0].reachable' <<<"$checks")" = "true"
          empty_zone='[{"name":"empty.example.","servers":["172.30.54.2"],"forward_first":false}]'
          empty_checks="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --argjson zones "$empty_zone" '{zones:$zones}')" \
            http://127.0.0.1:18080/api/unbound/forward-check)"
          test "$(jq 'length' <<<"$empty_checks")" = "1"
          test "$(jq -r '.[0].reachable' <<<"$empty_checks")" = "false"
          test "$(jq -r '.[0].detail | contains("did not return an SOA")' <<<"$empty_checks")" = "true"
          proposal="$(jq --argjson zones "$zones" '.forward_zones = $zones' <<<"$active")"
          preview="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            --header 'Content-Type: application/json' --data "$proposal" \
            http://127.0.0.1:18080/api/unbound/preview)"
          test "$(jq -r .changed <<<"$preview")" = "true"
          test "$(jq -r '.rendered_config | contains("forward-zone:") and contains("forward-addr: 172.30.54.2") and contains("domain-insecure: \"example.\"") and contains("private-domain: \"example.\"")' <<<"$preview")" = "true"
          invalid="$(jq --argjson zones '[{"name":".","servers":["127.0.0.1"],"forward_first":false}]' '.forward_zones = $zones' <<<"$active")"
          invalid_status="$(curl --silent --output /tmp/forward-error.json --write-out '%{http_code}' \
            --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' \
            --data "$invalid" http://127.0.0.1:18080/api/unbound/preview)"
          test "$invalid_status" = "400"
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request PUT \
            --header 'Content-Type: application/json' --data "$proposal" \
            http://127.0.0.1:18080/api/unbound/settings >/dev/null
          test "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1053 example. A)" = "192.168.50.80"
          expert_forward=$'forward-zone:\n    name: "legacy.example."\n    forward-addr: 172.30.54.2\n'
          conflict_status="$(curl --silent --output /tmp/forward-conflict.json --write-out '%{http_code}' \
            --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' \
            --data "$(jq -n --arg content "$expert_forward" '{content:$content}')" \
            http://127.0.0.1:18080/api/unbound/custom/preview)"
          test "$conflict_status" = "400"
          versions="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/history)"
          forward_id="$(jq -r '.[] | select((.settings.forward_zones // []) | length == 1) | .id' <<<"$versions" | head -1)"
          baseline_id="$(jq -r '.[] | select((.settings.forward_zones // []) | length == 0) | .id' <<<"$versions" | head -1)"
          test -n "$forward_id"
          test -n "$baseline_id"
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request POST \
            "http://127.0.0.1:18080/api/unbound/history/$baseline_id/restore" >/dev/null
          test "$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            http://127.0.0.1:18080/api/unbound/settings | jq '.forward_zones | length')" = "0"

      - name: Verify private DNS and reverse-zone lifecycle
        run: |
          active="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/settings)"
          proposal="$(jq \
            '.private_domains = ["home.example."] |
             .reverse_zones = [
               {"network":"10.0.0.0/8","mode":"nxdomain"},
               {"network":"172.16.0.0/12","mode":"nxdomain"},
               {"network":"192.168.0.0/16","mode":"transparent"}
             ]' <<<"$active")"
          preview="$(curl --fail --show-error --silent --cookie /tmp/rootguard-ci-cookies.txt \
            --header 'Content-Type: application/json' --data "$proposal" \
            http://127.0.0.1:18080/api/unbound/preview)"
          test "$(jq -r '.rendered_config |
            contains("private-domain: \"home.example.\"") and
            contains("local-zone: \"10.in-addr.arpa.\" static") and
            contains("local-zone: \"168.192.in-addr.arpa.\" transparent")' <<<"$preview")" = "true"
          curl --fail --show-error --silent --cookie /tmp/rootguard-ci-cookies.txt --request PUT \
            --header 'Content-Type: application/json' --data "$proposal" \
            http://127.0.0.1:18080/api/unbound/settings >/dev/null
          active_after="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/settings)"
          test "$(jq -r '.private_domains == ["home.example."]' <<<"$active_after")" = "true"
          test "$(jq -r '.reverse_zones[] | select(.network == "192.168.0.0/16") | .mode' <<<"$active_after")" = "transparent"
          custom=$'server:\n    local-zone: "lab.home.example." static\n    local-data: "router.lab.home.example. 300 IN A 192.168.50.81"\n    local-data-ptr: "192.168.50.81 router.lab.home.example."\n'
          payload="$(jq -n --arg content "$custom" '{content:$content}')"
          curl --fail --show-error --silent --cookie /tmp/rootguard-ci-cookies.txt --request PUT \
            --header 'Content-Type: application/json' --data "$payload" \
            http://127.0.0.1:18080/api/unbound/custom >/dev/null
          test "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1053 router.lab.home.example A)" = "192.168.50.81"
          test "$(docker exec rootguard-unbound dig +short +time=5 +tries=2 @127.0.0.1 -p 5335 -x 192.168.50.81)" = "router.lab.home.example."
          versions="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/history)"
          baseline_id="$(jq -r '.[] |
            select(((.settings.private_domains // []) | length) == 0) |
            select((.custom_config // "") == "") | .id' <<<"$versions" | head -1)"
          test -n "$baseline_id"
          curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt --request POST \
            "http://127.0.0.1:18080/api/unbound/history/$baseline_id/restore" >/dev/null
          restored="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt http://127.0.0.1:18080/api/unbound/settings)"
          test "$(jq '.private_domains | length' <<<"$restored")" = "0"
          test "$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            http://127.0.0.1:18080/api/unbound/custom | jq -r .content)" = ""

      - name: Verify capability-checked resolver protocol mode
        run: |
          capabilities="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            http://127.0.0.1:18080/api/unbound/network-capabilities)"
          test "$(jq -r .ipv4_available <<<"$capabilities")" = "true"
          active="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            http://127.0.0.1:18080/api/unbound/settings)"
          test "$(jq -r .network_mode <<<"$active")" = "ipv4"
          preview="$(curl --fail --silent --cookie /tmp/rootguard-ci-cookies.txt \
            --header 'Content-Type: application/json' --data "$active" \
            http://127.0.0.1:18080/api/unbound/preview)"
          test "$(jq -r '.rendered_config |
            contains("do-ip4: yes") and contains("do-ip6: no") and contains("prefer-ip6: no")' <<<"$preview")" = "true"
          if test "$(jq -r .ipv6_available <<<"$capabilities")" = "false"; then
            dual="$(jq '.network_mode = "dual"' <<<"$active")"
            status="$(curl --silent --output /tmp/network-mode-error.json --write-out '%{http_code}' \
              --cookie /tmp/rootguard-ci-cookies.txt --request PUT --header 'Content-Type: application/json' \
              --data "$dual" http://127.0.0.1:18080/api/unbound/settings)"
            test "$status" = "400"
          fi
          expert=$'server:\n    do-ip6: yes\n'
          status="$(curl --silent --output /tmp/network-expert-error.json --write-out '%{http_code}' \
            --cookie /tmp/rootguard-ci-cookies.txt --header 'Content-Type: application/json' \
            --data "$(jq -n --arg content "$expert" '{content:$content}')" \
            http://127.0.0.1:18080/api/unbound/custom/preview)"
          test "$status" = "400"

      - name: Verify password recovery and persistence
        run: |
          test "$(curl --fail --silent http://127.0.0.1:18080/api/auth/recovery | jq -r .enabled)" = "true"
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"recovery_token":"ci-rootguard-recovery-token-not-a-real-secret-32","new_password":"ci-new-rootguard-password"}' \
            http://127.0.0.1:18080/api/auth/recovery >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/rootguard-ci-cookies.txt \
            http://127.0.0.1:18080/api/auth/session)" = "401"
          docker compose -f compose.integration.yaml restart webapp
          for attempt in {1..30}; do
            login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie-jar /tmp/rootguard-ci-recovered-cookies.txt \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"ci-new-rootguard-password"}' \
              http://127.0.0.1:18080/api/auth/login || true)"
            if test "$login_status" = "200"; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f compose.integration.yaml logs --no-color

      - name: Stop RootGuard stack
        if: always()
        run: docker compose -f compose.integration.yaml down --volumes
