name: Docker Proxy CI

on:
  push:
    branches: [main]
    paths:
      - "rootguard-docker-proxy/**"
      - ".github/workflows/ci-docker-proxy.yml"
      # See ci-core.yml's identical comment for why.
      - "scripts/ci/trivy-image-scan.sh"
      - "scripts/ci/install-trivy.sh"
      - "scripts/ci/trivy-version.env"
      - ".trivyignore.yaml"
  # No paths filter on pull_request - see ci-core.yml's identical
  # comment for the full rationale: a required branch-protection status
  # check must run on every PR, not just ones that happen to touch this
  # component's own path, or GitHub waits forever for one that would
  # never report.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docker-proxy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/foxly-it/rootguard-docker-proxy

jobs:
  test:
    name: Docker proxy unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-docker-proxy/go.mod
          cache-dependency-path: rootguard-docker-proxy/go.sum
      - working-directory: rootguard-docker-proxy
        run: go test ./...
      - working-directory: rootguard-docker-proxy
        run: go vet ./...
      - working-directory: rootguard-docker-proxy
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted (run 'gofmt -w' on these):"
            echo "$unformatted"
            exit 1
          fi
      # Same reasoning as ci-attestation-proxy.yml's identical step: the
      # `build` job below only ever produces a pushed multi-arch manifest,
      # which can't be `--load`ed into the local daemon to scan - a real,
      # single-platform, locally loaded build lives here purely to give
      # trivy something to scan.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - working-directory: rootguard-docker-proxy
        run: docker buildx build --load --cache-from type=gha,scope=docker-proxy --cache-to type=gha,mode=max,scope=docker-proxy -t rootguard-docker-proxy:test .
      - run: ./scripts/ci/trivy-image-scan.sh rootguard-docker-proxy:test

  build:
    name: Build and push docker proxy image
    timeout-minutes: 20
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: rootguard-docker-proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-proxy
          cache-to: type=gha,mode=max,scope=docker-proxy
