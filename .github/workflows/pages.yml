name: RootGuard Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Refresh public project data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          releases="$(gh api "repos/$REPOSITORY/releases?per_page=100")"
          pulls="$(gh api "repos/$REPOSITORY/pulls?state=open&per_page=100")"
          commits="$(gh api "repos/$REPOSITORY/commits?per_page=5")"

          # Generated into a scratch file first, not straight into
          # site/project-data.json - found in a v1.0.0 correctness
          # review: a plain "> site/project-data.json" redirect truncates
          # the destination the moment the shell opens it, before jq
          # itself runs at all. This step's own continue-on-error: true
          # means a jq runtime error on a malformed API response (a
          # transient rate-limit/auth hiccup returning something that
          # isn't the expected shape) wouldn't fail the workflow - it
          # would truncate the live, publicly-deployed file to zero
          # bytes and then deploy exactly that, breaking the site's
          # project-data section until the next successful run (every 6h
          # per this workflow's own schedule). Only overwritten via `mv`
          # once jq has actually produced non-empty output, so a failed
          # generation instead just leaves the previous, still-good
          # committed copy in place.
          jq -n \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson releases "$releases" \
            --argjson pulls "$pulls" \
            --argjson commits "$commits" \
            '{
              generated_at: $generated_at,
              current_version: (($releases | map(select(.draft == false)) | first | .tag_name) // "unreleased"),
              pull_requests: ($pulls | map({
                number: .number,
                title: .title,
                updated_at: .updated_at,
                html_url: .html_url
              })),
              commits: ($commits | map({
                sha: .sha[0:7],
                message: (.commit.message | split("\n")[0]),
                date: .commit.author.date,
                html_url: .html_url
              })),
              releases: ($releases | map({
                tag: .tag_name,
                name: (.name // .tag_name),
                published_at: .published_at,
                html_url: .html_url,
                prerelease: .prerelease,
                summary: (([.body | split("\n")[] | select(
                  length > 0 and
                  (startswith("#") | not) and
                  (startswith("- ") | not) and
                  (startswith("```") | not)
                )][0]) // ""),
                highlights: ([.body | split("\n")[] | select(startswith("- ")) | ltrimstr("- ")][0:4])
              }))
            }' > site/project-data.json.new
          if [ -s site/project-data.json.new ]; then
            mv site/project-data.json.new site/project-data.json
          else
            echo "::warning::generated project-data.json was empty - keeping the previous committed copy"
            rm -f site/project-data.json.new
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
