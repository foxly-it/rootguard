name: RootGuard Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Refresh public project data
        id: project-data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          api="$RUNNER_TEMP/project-data"
          mkdir -p "$api"
          gh api "repos/$REPOSITORY/releases?per_page=100" > "$api/releases.json"
          gh api "repos/$REPOSITORY/pulls?state=open&per_page=100" > "$api/pulls.json"
          gh api "repos/$REPOSITORY/commits?per_page=5" > "$api/commits.json"

          # Generated into a scratch file outside site/ first, not straight into
          # site/project-data.json - found in a v1.0.0 correctness
          # review: a plain "> site/project-data.json" redirect truncates
          # the destination the moment the shell opens it, before jq
          # itself runs at all. This step's own continue-on-error: true
          # means a jq runtime error on a malformed API response (a
          # transient rate-limit/auth hiccup returning something that
          # isn't the expected shape) wouldn't fail the workflow - it
          # would truncate the live, publicly-deployed file to zero
          # bytes and then deploy exactly that, breaking the site's
          # project-data section until the next successful run (every 6h
          # per this workflow's own schedule). Only overwritten via `mv`
          # once jq has actually produced non-empty output, so a failed
          # generation instead just leaves the previous, still-good
          # committed copy in place.
          ./scripts/ci/build-project-data.sh "$api/releases.json" "$api/pulls.json" "$api/commits.json" \
            > "$api/project-data.json"
          mv "$api/project-data.json" site/project-data.json

      # The step above may fail without taking the site down with it, but it
      # must not do so unnoticed: from 2026-11-19 to 2026-11-24 every run was
      # green while the project section of the site had no data. Only a
      # warning, because security-release.yml waits for every check on HEAD.
      - name: Warn about stale project data
        if: steps.project-data.outcome == 'failure'
        run: |
          echo "::warning title=Project data not refreshed::The website is being deployed with the committed site/project-data.json, so its project section shows no live data. See the 'Refresh public project data' step."

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build bilingual marketing pages
        run: python3 scripts/build-bilingual-site.py

      - name: Build documentation (MkDocs)
        run: |
          pip install --no-cache-dir mkdocs-material==9.7.7 mkdocs-static-i18n==1.3.1
          mkdocs build -f docs-site/mkdocs.yml --strict

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      # Found live, 2026-11-24/25: GitHub lists a freshly uploaded artifact late,
      # so a deploy right after the upload stops with "No artifacts named
      # github-pages were found" (actions/deploy-pages#451). Never seen in the 138
      # runs before, then 4 of 5 deploys within a day, with the same half second
      # between upload and lookup as before. Reports there put the delay at up to 6 seconds, once
      # at 46, hence one wait and three attempts over about 100 seconds instead of
      # a longer fixed sleep. Re-running by hand is not a substitute: a red run on
      # HEAD blocks security-release.yml. The last attempt still fails the run.
      - name: Wait for the artifact to be listed
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deploy-1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Wait before the second attempt
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (second attempt)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Wait before the last attempt
        if: steps.deploy-2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (last attempt)
        id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
