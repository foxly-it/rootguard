name: Trivy suppression expiry

# Trivy stops honoring a .trivyignore.yaml entry the day its expired_at
# passes, so the finding fails every scan job again at once (#710). This
# opens - or refreshes - one tracking issue 14 days ahead, so each entry
# gets re-reviewed (fixed upstream by now? still unreachable?) before CI
# turns red.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Trivy suppressions expiring soon
        run: |
          set -euo pipefail
          # Actions runs this with bash -e: exit 1 ("entries due") must not
          # abort the step before the issue gets written.
          rc=0
          report="$(./scripts/ci/check-trivyignore-expiry.sh 14)" || rc=$?
          echo "$report"
          [ "$rc" -eq 0 ] && exit 0
          [ "$rc" -ne 1 ] && exit "$rc"
          # shellcheck disable=SC2016 # literal backticks: Markdown code fence
          body="$(printf '%s\n\n```\n%s\n```\n\n%s' \
            "These \`.trivyignore.yaml\` entries have expired or expire within 14 days. Trivy stops honoring an entry on that date, and the finding fails the scans again." \
            "$report" \
            "For each one, check whether a fixed upstream build exists now (then fix and drop the entry) or whether the reachability statement still holds (then bump \`expired_at\`). Updated daily by \`trivyignore-expiry.yml\`.")"
          number="$(gh issue list --state open --limit 200 --json number,title \
            -q 'map(select(.title == env.TITLE))[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
