name: Core CI

on:
  push:
    branches: [main]
    paths:
      - "rootguard-core/**"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "rootguard-core/**"
      - ".github/workflows/ci-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rootguard-core/go.mod
          cache-dependency-path: rootguard-core/go.sum
      - working-directory: rootguard-core
        run: go test ./...
      - working-directory: rootguard-core
        run: go vet ./...
      - working-directory: rootguard-core
        run: docker build -t rootguard-core:test .

  # Exercises the pre-update snapshot/rollback path (Manager.backup,
  # Manager.rollback, and the SHA-256 checksum verification guarding it)
  # against a real Docker container, a real docker-compose image swap, and a
  # real docker cp - not the mocked CommandRunner the `test` job's unit tests
  # use. Runs under its own isolated Compose project
  # (rollback_integration_test.go's fixtureComposeProject), never the
  # production DefaultComposeProject, so it cannot interact with a real
  # RootGuard deployment.
  updater-rollback-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rootguard-core/go.mod
          cache-dependency-path: rootguard-core/go.sum
      - working-directory: rootguard-core
        run: go test -tags integration ./internal/updater/... -run TestRollback -v
