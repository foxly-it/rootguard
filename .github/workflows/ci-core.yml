name: Core CI

on:
  push:
    branches: [main]
    paths:
      - "rootguard-core/**"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "rootguard-core/**"
      - ".github/workflows/ci-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-core/go.mod
          cache-dependency-path: rootguard-core/go.sum
      - working-directory: rootguard-core
        run: go test ./...
      - working-directory: rootguard-core
        run: go vet ./...
      # Found in review: nothing ever caught a non-gofmt-formatted file
      # (go test/go vet don't check formatting at all) - one landed and
      # stayed unnoticed until a later, unrelated review happened to spot
      # it. gofmt -l lists any file whose formatting would change; a
      # non-empty list fails the build instead of relying on a human to
      # notice.
      - working-directory: rootguard-core
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted (run 'gofmt -w' on these):"
            echo "$unformatted"
            exit 1
          fi
      - working-directory: rootguard-core
        run: docker build -t rootguard-core:test .

  # Exercises the pre-update snapshot/rollback path (Manager.backup,
  # Manager.rollback, and the SHA-256 checksum verification guarding it) and
  # the power-loss/interrupted-write path (a real SIGKILL of a subprocess
  # helper mid-update, then a fresh Manager restarted against the same
  # on-disk state) against a real Docker container, a real docker-compose
  # image swap, and a real docker cp - not the mocked CommandRunner the
  # `test` job's unit tests use. Runs under its own isolated Compose project
  # (rollback_integration_test.go's fixtureComposeProject), never the
  # production DefaultComposeProject, so it cannot interact with a real
  # RootGuard deployment. The analogous power-loss test for the guided
  # installation path (internal/installer) needs no real Docker - it is Go-
  # only (mocked Run/Bootstrap) and already runs in the `test` job above via
  # plain `go test ./...`.
  updater-rollback-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-core/go.mod
          cache-dependency-path: rootguard-core/go.sum
      - working-directory: rootguard-core
        run: go test -tags integration ./internal/updater/... -run "TestRollback|TestUpdatePowerLoss" -v
