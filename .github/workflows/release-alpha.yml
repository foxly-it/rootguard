name: Publish RootGuard release images

# workflow_dispatch only - found in review: this used to also trigger on
# a pushed "v*.*.*" tag, structurally incompatible with the tag-lifecycle
# rework a few PRs earlier in this same round: that rework requires the
# release tag to not exist yet when this workflow starts, created here
# exactly once, only after every gate has passed, directly on the final
# pin commit - and never moved again afterward under any circumstance.
# A manually pushed tag violates that up front (the tag already exists,
# pointing at the pre-pin source commit, before a single test has run)
# and the later "never move a published tag" guard would then correctly,
# but unhelpfully, refuse to finish the release at all. The one
# supported way to cut a release is release-version-bump.yml's own
# workflow_dispatch of this workflow (see docs/release-process.md); a
# fully separate tag-push procedure was judged not worth maintaining
# alongside it for what would only ever be a manual escape hatch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: 0.1.0-alpha.4
      source_sha:
        description: >-
          Exact commit to build from (set by release-version-bump.yml).
          Leave empty to build from whatever the dispatch ref resolves to
          - only safe for a manual by-hand dispatch, never for automation.
        required: false
        default: ""

# Serializes the entire release process, not just this workflow -
# release-version-bump.yml pushes to main and shares this same group name
# deliberately. Found in review: without this, two release attempts
# running at once (a manual dispatch overlapping the scheduled/automated
# one, or two manual dispatches) could each push conflicting pin/tag
# commits to main, or move the same release tag out from under each
# other. cancel-in-progress is deliberately false - a partially-applied
# git push or a half-published set of images is worse than a queued wait.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CLIFF_VERSION: "2.13.1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.release.outputs.value }}
      # source_ref is what every other job's checkout below actually
      # builds from - found in review: every job used to default to
      # actions/checkout's own ambient github.sha, which for a
      # workflow_dispatch run is resolved from the *ref* (main) at
      # whatever moment this run's checkout actually happens - not
      # necessarily the exact commit whoever/whatever triggered the
      # dispatch intended, if anything else pushed to main in between.
      # inputs.source_sha (set by release-version-bump.yml) pins it
      # explicitly; a manual by-hand dispatch with no source_sha still
      # gets today's previous behavior (github.sha).
      #
      # Found in review: this used to be the raw
      # `inputs.source_sha || github.sha` expression - release-version-
      # bump.yml always passes a full 40-character SHA, but the input's
      # own description explicitly allows a manual by-hand dispatch to
      # type an abbreviated one instead. Every later full-SHA comparison
      # in this file (origin/main's tip, a tag's dereferenced commit, the
      # commit-ancestry guard below) would then silently never match, and
      # the mismatch surfaces late - after the candidate images are
      # already built and scanned - instead of failing fast. Resolved
      # once, below, via `git rev-parse HEAD` against the checkout at
      # that ref, so every job downstream always sees the same full SHA
      # regardless of what was actually typed into the dispatch input.
      source_ref: ${{ steps.release.outputs.source_ref }}
      # Computed once here, not per-job/per-matrix-leg, so publish,
      # smoke-test, upgrade-test, and update-alpha-pins all agree on
      # exactly the same candidate tag without each having to re-derive it
      # (GitHub Actions expressions can't slice a string themselves, so
      # this needs a real shell step regardless - doing it once here avoids
      # duplicating that shell logic four times over).
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
    steps:
      # fetch-depth: 0, not the default shallow clone - the ancestry guard
      # below needs the full tag history to find the currently-published
      # latest release and walk the commit graph from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          # Resolved to the full 40-character SHA the checkout above
          # actually landed on, not the raw (possibly abbreviated)
          # dispatch input - see the "source_ref" output's own comment
          # above on why. Every later use of SOURCE_REF in this file,
          # including the outputs below, is this resolved value.
          SOURCE_REF="$(git rev-parse HEAD)"
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          # workflow_dispatch's own "version" input is required (schema
          # default: 0.1.0-alpha.4), so DISPATCH_VERSION is always
          # non-empty now that this workflow no longer also triggers on
          # a pushed tag (see the "on:" block's own comment on why that
          # trigger was removed) - the GITHUB_REF_NAME-derived fallback
          # that branch needed is gone with it, not left behind as dead
          # code nothing can ever reach.
          version="$DISPATCH_VERSION"
          # A shell glob like [0-9]*.[0-9]*.[0-9]* only checks "digit,
          # anything, digit, anything, digit, anything" - it happily
          # accepts "1foo.2bar.3baz", a leading-zero core like "01.2.3",
          # and build metadata ("1.2.3+build.4", which Docker tags can't
          # even represent since '+' isn't a legal tag character). Core
          # would later reject such a tag via semver.IsValid, so a
          # malformed tag here would publish images that automatic update
          # discovery can never find. require_semver enforces the full
          # SemVer 2.0 core+prerelease grammar - see
          # scripts/lib/semver-validate.sh for why this is shared with
          # release-version-bump.yml's own check rather than duplicated.
          source scripts/lib/semver-validate.sh
          require_semver "$version"
          # Found in review: nothing ever checked that this run's
          # SOURCE_REF actually descends from the currently-published
          # latest release - a stale re-dispatch (an old workflow re-run,
          # a hand-typed version override against an old branch/commit)
          # could silently regress the public compose.release.yaml/
          # .env.release.example pins back to an older state. Reject
          # outright unless SOURCE_REF has the latest release's own commit
          # as an ancestor (or is that exact commit again - the legitimate
          # same-version-retry case, and the only-release-so-far case where
          # no prior tag exists yet, both fall through untouched). This is
          # commit-ancestry, not a version-number comparison - a
          # deliberately higher version string typed against an old commit
          # is caught exactly the same way a lower one would be.
          #
          # Found in review: the two other places in this file that filter
          # tags down to "real SemVer ones" each hand-wrote their own copy
          # of this same regex - one of them silently drifted (missing the
          # hyphen SemVer allows inside a prerelease identifier, so a real
          # tag like v1.2.3-rc-hotfix.1 was invisible to it). Reusing
          # $SEMVER_PATTERN (sourced above) at all three sites means a
          # future grammar change can't silently re-diverge the same way.
          latest_tag="$(git for-each-ref 'refs/tags/v*' --sort=-creatordate --format='%(refname:short)' \
            | grep -E "^v${SEMVER_PATTERN#^}" | head -1 || true)"
          if [ -n "$latest_tag" ] && [ "$latest_tag" != "v${version}" ]; then
            latest_commit="$(git rev-parse "${latest_tag}^{}")"
            if ! git merge-base --is-ancestor "$latest_commit" "$SOURCE_REF"; then
              echo "::error::${SOURCE_REF} does not descend from ${latest_tag} (${latest_commit}), the currently-published latest release - refusing to cut ${version} from a commit that isn't ahead of what's already public. This is very likely a stale re-dispatch or a version override against the wrong commit; start a fresh release from the current main instead." >&2
              exit 1
            fi
            # Found in review: commit ancestry alone says nothing about
            # whether the *version number* itself is actually newer -
            # confirmed live that "0.9.9" against a HEAD descending from
            # the real published "1.0.0-rc.1" passed the ancestry check
            # above cleanly. require_new_version enforces real SemVer 2.0
            # precedence (see semver-compare.sh's own comment on why not
            # sort -V) so a manual override can't publish an unused but
            # semantically older version and reset public pins back to
            # it. Inside this same "not the identical version again"
            # branch deliberately - the legitimate same-version-retry
            # case must keep skipping both checks the same way.
            source scripts/lib/semver-compare.sh
            require_new_version "$version" "${latest_tag#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # Commit-scoped, not just version-scoped - see the "Determine the
          # candidate tag" comment in the publish job for why that matters.
          echo "candidate_tag=${version}-candidate-${SOURCE_REF:0:12}" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: rootguard-core/go.mod
          cache: false
      - run: go vet ./... && go test ./...
        working-directory: rootguard-core
      - run: go vet ./... && go test ./...
        working-directory: rootguard-updater
      - run: go vet ./... && go test ./...
        working-directory: rootguard-webapp/backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rootguard-webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: rootguard-webapp/frontend
      - run: npm run lint
        working-directory: rootguard-webapp/frontend
      # Was missing entirely - found in review: ci-webapp.yml's own PR
      # checks run this, but a release cut has no PR and this job never
      # ran it, so a frontend regression that only unit tests would catch
      # (not lint, not the production build) could slip straight into a
      # published release.
      - run: npm test
        working-directory: rootguard-webapp/frontend
      - run: npm run build
        working-directory: rootguard-webapp/frontend

  # Found in review: nothing in this pipeline ever actually waited on
  # ci-security.yml's result before publishing - that workflow only ran
  # against main's push trigger, an untimed, unenforced signal decoupled
  # from this run (release-version-bump.yml pushes to main and dispatches
  # this workflow separately, with no dependency between the two). Calling
  # it directly here, pinned to the exact commit this release builds from,
  # makes gitleaks/trivy/govulncheck/staticcheck an actual release-gate
  # requirement instead of something only trusted to have run at some
  # earlier point.
  security:
    needs: version
    uses: ./.github/workflows/ci-security.yml
    with:
      ref: ${{ needs.version.outputs.source_ref }}
    permissions:
      contents: read

  publish:
    needs: [version, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            image: rootguard-core
            context: rootguard-core
          - component: webapp
            image: rootguard-webapp
            context: rootguard-webapp
          - component: updater
            image: rootguard-updater
            context: rootguard-updater
          - component: unbound
            image: rootguard-unbound
            context: rootguard-unbound
          - component: blockpage
            image: rootguard-blockpage
            context: rootguard-blockpage
          - component: attestation-proxy
            image: rootguard-attestation-proxy
            context: rootguard-attestation-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Found in review (releasekritisch #1/#2): this job used to build and
      # push straight to the FINAL version tag, before smoke-test/upgrade-test
      # had run - so a bad release still left a real, pullable
      # ghcr.io/.../IMAGE:VERSION behind, and the idempotency check below
      # keyed on that same final tag meant a re-run after a fixed bug could
      # not correct it (tag already "exists", build+attestation silently
      # skipped, the stale/broken image reused) while release notes kept
      # claiming it was built from the current commit.
      #
      # Publishing to a commit-scoped CANDIDATE tag instead closes both at
      # once: nothing under the final version tag is ever touched here, so
      # a failed test run leaves no public artifact under that name to
      # accidentally reuse; and because the candidate tag encodes the exact
      # commit, "does this candidate already exist" and "was this the right
      # commit" collapse into the same question - a re-run of a genuinely
      # new commit always gets its own, different candidate tag rather than
      # silently being satisfied by an old build of a different commit.
      # Promotion to the final version tag happens later, in
      # update-alpha-pins, only after both E2E jobs have actually passed.
      - name: Check for an already-built candidate image
        id: existing
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.candidate_tag }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine build timestamp
        id: build-time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: push
        if: steps.existing.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.candidate_tag }}
          # Deliberately no org.opencontainers.image.version here: every
          # Dockerfile already sets it from a build-arg (VERSION below for
          # core/webapp/updater/blockpage, whose own software version is the
          # release version) - except rootguard-unbound's, which sets it from
          # its own UNBOUND_VERSION default (the actual resolver version,
          # e.g. 1.25.2). Passing it here as an extra label would win over
          # the Dockerfile's own LABEL for the same key on every image,
          # silently overwriting unbound's intentionally different value
          # with the RootGuard release tag.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version.outputs.source_ref }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.value }}
          build-args: |
            VERSION=${{ needs.version.outputs.value }}
            COMMIT=${{ needs.version.outputs.source_ref }}
      - name: Attest published image provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Runs unconditionally, not just on a fresh push - steps.push.outputs.digest
      # is only set when the build actually ran (see "Check for an
      # already-built candidate image" above), so a re-run against a
      # candidate that already exists (a retry of the same commit) falls
      # back to looking the digest up directly from the registry. Both
      # smoke-test/upgrade-test below and the later promotion step need a
      # real digest either way. blockpage is included here too now - found
      # in review: it was excluded, so it ran a mutable, never-pinned
      # :latest tag with no attestation ever checked, unlike every other
      # RootGuard-built component.
      - name: Record published digest
        id: digest
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.candidate_tag }}
        run: |
          if [ -n "${{ steps.push.outputs.digest }}" ]; then
            digest="${{ steps.push.outputs.digest }}"
          else
            digest="$(docker buildx imagetools inspect "$CANDIDATE_IMAGE" --format '{{.Manifest.Digest}}')"
          fi
          mkdir -p /tmp/digests
          printf '%s' "$digest" > "/tmp/digests/${{ matrix.image }}.digest"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.component }}
          path: /tmp/digests/${{ matrix.image }}.digest

  # Found in review, round 15: trivy-image-scan.sh (round 13) only ever
  # ran against a component's own PR-time build (single-platform, never
  # published) - nothing in this pipeline ever scanned the actual
  # multi-arch candidate images publish just pushed, so a CVE reachable
  # only on one platform, or introduced by something specific to the
  # release build (a build-arg, a base-image digest that moved between a
  # component's last PR and this release), could ship undetected. Scans
  # every one of the five images publish just built, on both platforms it
  # actually published (matrix, not a single combined scan, so one
  # platform's findings can never mask another's) - the exact
  # ghcr.io/.../IMAGE:candidate_tag references, before promotion to the
  # final version tag. `trivy image` reads a remote registry reference
  # directly (confirmed live, no local `docker pull` needed) - the
  # login-action above already leaves it able to authenticate through
  # ~/.docker/config.json the same way it would for a local `docker
  # build`.
  image-scan:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [rootguard-core, rootguard-webapp, rootguard-updater, rootguard-unbound, rootguard-blockpage, rootguard-attestation-proxy]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan candidate image for vulnerabilities
        run: >-
          ./scripts/ci/trivy-image-scan.sh --platform ${{ matrix.platform }}
          ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.candidate_tag }}

  # compose.release.yaml and .env.release.example are the pinned, no-build public
  # release model - their default/documented image references need to track
  # whatever publish just pushed, or every fresh clone silently keeps running
  # the *previous* release's digests forever. .env.release.example is what the
  # quick start actually tells users to download as their .env, and its
  # values there take precedence over compose.release.yaml's own defaults - so
  # both files must be kept in lockstep, not just the compose file. blockpage
  # is included in the pin loop below now too - found in review: it used to
  # be excluded ("Core provisions it dynamically" isn't a reason to leave it
  # unpinned, just a reason it lives in a different variable than the
  # updater-managed services), which meant a fresh install could run a
  # blockpage image from an entirely different commit than the rest of the
  # release, with no digest pin and no attestation ever checked for it.
  # Requires both E2E test jobs to have actually passed, not just publish -
  # found in review: this job used to run in parallel with smoke-test and
  # upgrade-test, so a failing upgrade-test still left final image tags,
  # committed pins on main, and a moved release tag all live and visible.
  # The candidate-tag rework above (see the publish job's own comment)
  # already keeps a failed test from leaving a final image tag behind at
  # all - this ordering is what closes the other half: without it, a
  # failing upgrade-test could still leave committed pins on main and a
  # moved release tag referencing a candidate that never actually promoted.
  # (The GitHub Release itself moved here too, for the same reason - see
  # its own step below.)
  update-alpha-pins:
    needs: [version, publish, image-scan, smoke-test, upgrade-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      # For the promotion step below - imagetools create pushes a new tag
      # (the final version tag) pointing at an already-published digest.
      packages: write
    # Dummy values, not real secrets - only needed so "docker compose config"
    # can interpolate compose.release.yaml's mandatory ${VAR:?...} entries
    # for the structural validation step below; no container in this job
    # actually starts. Mirrors ci.yml's "validate" job env block exactly -
    # found live, cutting 1.0.0-rc.2: this job only started running its own
    # compose-validation step on 2026-08-28 (gated behind smoke-test/
    # upgrade-test passing first) and had never actually reached it in a
    # real run until now, so the missing env block went unnoticed.
    env:
      ROOTGUARD_API_TOKEN: ci-rootguard-token-not-a-real-secret-32
      ROOTGUARD_ADMIN_PASSWORD: ci-rootguard-password
      ROOTGUARD_RECOVERY_TOKEN: ci-rootguard-recovery-token-not-a-real-secret-32
    steps:
      # Found live: `main` requires 20 status checks on every push, not
      # just PR merges - see release-version-bump.yml's identical
      # checkout-step comment for the full rationale. This job pushes to
      # `main` twice (the pin commit below, and the release tag) and
      # needs the same admin-owned `RELEASE_PAT` for both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # Found in review, round 5: the only place this job checked "has main
      # moved on since this release was tested" used to be the "Commit
      # updated pins" step, far below - by which point candidate images had
      # already been irreversibly promoted to the *final* VERSION image
      # tags. This cheap early check avoids wasting the rest of the job
      # (buildx/cosign setup, attestation checks, pin generation) on a run
      # that's already doomed.
      #
      # Found in review, round 6: a cheap early check alone isn't enough -
      # every step between here and the actual promotion (buildx/cosign
      # setup, per-image attestation checks, digest-pin file edits, compose
      # validation, site refresh) still ran *before* promotion, all inside
      # the same race window. The real fix is ordering, not just an extra
      # check: promotion (irreversible, public) now happens only after the
      # pin commit has already landed on main - see "Promote candidate
      # images to the final release tag" further below for where it moved
      # to, and "Commit updated pins" for the one check that actually gates
      # it now.
      #
      # Found in review, round 7: that round-6 reorder made this guard's
      # own strict SOURCE_REF-equality check unreachable for the exact
      # retry case it was meant to allow - once "Commit updated pins" has
      # ever successfully pushed, origin/main is that pin commit (a child
      # of SOURCE_REF), not SOURCE_REF itself, so this step aborted every
      # retry before "Commit updated pins" ever got a chance to recognize
      # its own earlier commit. Delegates to
      # resolve-release-pin-commit.sh now - the one place that decides
      # "is this a fresh run, a safe retry of our own pin commit, or a
      # genuine race", precisely (by this release's own unique commit
      # message and shape, not by comparing file content) rather than by
      # strict equality alone.
      #
      # Just a cheap fail-fast here, not the real gate - found in review,
      # round 8: this step's own result used to be handed straight to
      # "Commit updated pins" as its answer too, but the buildx/cosign
      # setup, attestation checks, digest-pin edits, compose validation,
      # and site refresh in between are exactly the kind of window this
      # job already treats as unsafe to trust a stale answer across (see
      # "Commit updated pins" itself, and "Verify main hasn't moved" two
      # rounds ago). This step exists purely so a run that's already
      # doomed - main moved and no valid retry point exists - fails
      # before wasting all of that, not to hand its answer downstream;
      # "Commit updated pins" resolves fresh, right before it matters.
      - name: Resolve main state (fresh run, or a retry of our own earlier pin commit)
        env:
          SOURCE_REF: ${{ needs.version.outputs.source_ref }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          source scripts/lib/resolve-release-pin-commit.sh
          git fetch origin main
          # resolve_release_pin_commit prints its own descriptive message
          # to stderr and returns non-zero on anything it won't vouch for
          # - under set -e, that fails this step outright (its message is
          # already in the log by then, no need to re-wrap it here).
          pin_commit="$(resolve_release_pin_commit "$SOURCE_REF" "$VERSION" origin/main)"
          if [ -n "$pin_commit" ]; then
            echo "origin/main has moved past ${SOURCE_REF}, but ${pin_commit} is verified as this exact release's own earlier pin commit - resuming from it"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same cosign version rootguard-core's own Dockerfile pins (see its
      # `FROM ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:...` stage, and
      # its comment there on why it moved from v3.0.6) - needed below to
      # validate a candidate's attestation before promoting it, the same
      # check stack.RequireAttestation performs at deploy time
      # (internal/stack/attestation.go).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Verification only - no promotion here. Found in review, round 6:
      # this used to promote in the same loop, before the pin commit and
      # its own main-race check further below - meaning candidate images
      # could already be public under the final VERSION tag by the time
      # that check ran, so an abort there still burned the version number.
      # Splitting verification (safe to run early, nothing irreversible)
      # from promotion (moved after the pin commit, see below) closes that.
      - name: Verify candidate images and attestations
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_REF: ${{ needs.version.outputs.source_ref }}
        run: |
          set -euo pipefail
          for image in rootguard-core rootguard-webapp rootguard-updater rootguard-unbound rootguard-blockpage rootguard-attestation-proxy; do
            digest="$(cat "/tmp/digests/${image}.digest")"
            test -n "$digest"
            source_ref="ghcr.io/${OWNER}/${image}@${digest}"

            # The digest above came from an artifact written by the publish
            # job's matrix leg for this image, trusted as-is - including on
            # its "candidate already existed" retry path, which never
            # re-runs the build or the attest step at all (see publish's
            # own "Record published digest" comment) and just looks the
            # digest up from the registry. Re-verify both properties this
            # job actually depends on, here, every time, regardless of
            # which path produced the digest:
            #
            # 1. The candidate was genuinely built from the exact commit
            #    this release run tested/security-scanned - not just a tag
            #    collision or a stale artifact. Compare the full
            #    org.opencontainers.image.revision label (candidate_tag
            #    only encodes a 12-char commit prefix), across exactly the
            #    two platforms the publish job's build matrix always
            #    produces (see its own `platforms:` line) - not just a
            #    platform *count*, confirmed live to let e.g.
            #    linux/amd64+linux/s390x through unnoticed.
            platform_check="$(docker buildx imagetools inspect "$source_ref" --format '{{json .Image}}' \
              | jq -r --arg want "$SOURCE_REF" '
                  (keys | sort) as $platforms
                  | (["linux/amd64","linux/arm64"] == $platforms) as $platforms_ok
                  | (all(.[]; .config.Labels["org.opencontainers.image.revision"] == $want)) as $all_match
                  | if $platforms_ok and $all_match then "ok" else "platforms=\($platforms), expected exactly [\"linux/amd64\",\"linux/arm64\"]; all matching \($want): \($all_match)" end
                ')"
            if [ "$platform_check" != "ok" ]; then
              echo "::error::${image}: candidate ${source_ref} failed the per-platform revision check (${platform_check})." >&2
              exit 1
            fi
            # 2. A valid release attestation actually exists for it - the
            #    same policy stack.RequireAttestation enforces at deploy
            #    time (internal/stack/attestation.go), checked here too so
            #    a candidate whose attest step silently failed (or never
            #    ran, on the retry path above) can never be promoted.
            cosign verify-attestation --type https://slsa.dev/provenance/v1 \
              --certificate-identity-regexp '^https://github\.com/foxly-it/rootguard/\.github/workflows/release-alpha\.yml@refs/(tags/v[^/]+|heads/main)$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository foxly-it/rootguard \
              "$source_ref" >/dev/null
          done

      - name: Update digest pins
        env:
          VERSION: ${{ needs.version.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for file in compose.release.yaml .env.release.example; do
            for image in rootguard-core rootguard-webapp rootguard-updater rootguard-unbound rootguard-blockpage rootguard-attestation-proxy; do
              digest="$(cat "/tmp/digests/${image}.digest")"
              test -n "$digest"
              # [^@\"}] - not just [^@\"] - because ROOTGUARD_UPDATER_UPDATE_IMAGE
              # is the one *_UPDATE_IMAGE line whose default fallback has no
              # pre-existing @sha256: digest (it's an intentionally unpinned
              # :latest, see compose.release.yaml's own comment on that line).
              # Without excluding "}" too, the greedy match swallowed the
              # closing brace of the surrounding ${VAR:-default}" wrapper on
              # v0.1.0-beta.5's cut, breaking the file's YAML syntax outright
              # (caught live, not by CI - docker compose config never ran
              # against this exact committed pin-refresh commit).
              sed -i -E "s#(ghcr\.io/${OWNER}/${image}:)[^@\"}]+(@sha256:[0-9a-f]+)?#\1${VERSION}@${digest}#g" "$file"
            done
            # Keep the descriptive header comment's version number in sync too -
            # left stale after alpha.7 since only the image pins were automated.
            # Matches any -<series>.<N> suffix (alpha/beta/rc/...), not just
            # alpha, so it keeps working across series transitions. Delimiter
            # is | rather than the usual # since # is both the sed delimiter
            # convention used above and a literal character in the comment
            # line itself being matched here.
            sed -i -E "s|^(# RootGuard )[0-9]+\.[0-9]+\.[0-9]+-[a-z]+\.[0-9]+|\1${VERSION}|" "$file"
          done

      # Found in review, and confirmed by the comment right above this one:
      # the pin-sed's greedy match once swallowed a closing brace and broke
      # compose.release.yaml's YAML syntax outright on a real release cut,
      # undetected because this commit carries [skip ci] and nothing here
      # ever re-validated the file it just rewrote. Same assertions
      # ci.yml's own "Validate public release Compose model" step already
      # runs on every PR - can't drift apart from that, and can't ship a
      # release whose pins are silently missing a digest or still pointing
      # at a mutable :latest tag.
      - name: Validate the rewritten public release Compose model
        run: |
          set -euo pipefail
          docker compose -f compose.release.yaml config --quiet
          model="$(docker compose -f compose.release.yaml config --format json)"
          test "$(jq -r 'any(.services[]; has("build"))' <<<"$model")" = false
          # .services[].image already covers attestation-proxy too - it
          # has an `image:` key like every other service, no separate
          # line needed.
          test "$(jq -r '[.services[].image, .services.core.environment.ROOTGUARD_UNBOUND_IMAGE, .services.core.environment.ROOTGUARD_ADGUARD_IMAGE, .services.core.environment.ROOTGUARD_ADGUARD_BETA_IMAGE, .services.core.environment.ROOTGUARD_UNBOUND_UPDATE_IMAGE, .services.core.environment.ROOTGUARD_ADGUARD_UPDATE_IMAGE, .services.core.environment.ROOTGUARD_BLOCKPAGE_IMAGE, .services.updater.environment.ROOTGUARD_CORE_UPDATE_IMAGE, .services.updater.environment.ROOTGUARD_WEBAPP_UPDATE_IMAGE] | all(contains("@sha256:"))' <<<"$model")" = true
          test "$(jq -r '[.services[].image] | any(test("(^|:)latest(@|$)"))' <<<"$model")" = false
          # Found in review: nothing ever automated-checked that Core
          # and the Updater actually get ROOTGUARD_ATTESTATION_PROXY_URL
          # - a silently-dropped env var here would reproduce the exact
          # isolated-network attestation failure this component exists
          # to fix, undetected until a real deploy hit it.
          test "$(jq -r '.services.core.environment.ROOTGUARD_ATTESTATION_PROXY_URL, .services.updater.environment.ROOTGUARD_ATTESTATION_PROXY_URL | . == "http://attestation-proxy:8888"' <<<"$model" | sort -u)" = "true"
          test "$(jq -r '.services["attestation-proxy"].networks | has("control") and has("egress")' <<<"$model")" = true

      # site/*.html's version references went stale twice in the two days
      # after v0.1.0-beta.2 and v0.1.0-beta.3 each shipped - nothing here
      # ever touched them, only compose.release.yaml/.env.release.example.
      # bump-site-versions.sh runs the exact same logic
      # check-site-facts.sh checks for, so this and that check can never
      # drift apart. Idempotent: a no-op when the site already matches.
      # ROOTGUARD_RELEASE_VERSION overrides both scripts' git-tag-based
      # "current version" detection - found live, cutting 1.0.0-rc.2: this
      # run's own release tag doesn't exist yet at this point in the job
      # (created much later, once every other gate has passed), so without
      # the override both scripts fell back to the *previous* release's
      # tag and silently left every general version reference one release
      # behind. See rootguard_current_version's own comment in
      # version-pattern.sh for the full rationale.
      - name: Refresh site/*.html version references
        env:
          ROOTGUARD_RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/bump-site-versions.sh

      # The pin commit below carries [skip ci] (a mechanical, low-risk
      # pin-only commit shouldn't re-trigger the whole CI matrix), which
      # means ci.yml's own check-site-facts.sh run would never see it -
      # verify right here instead, so a gap in bump-site-versions.sh fails
      # this workflow loudly instead of shipping an unverified site.
      - name: Verify site facts are current
        env:
          ROOTGUARD_RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/check-site-facts.sh

      # Found in review, round 7: this step used to re-decide "is this a
      # safe retry" itself, a second and looser way than the early guard
      # above - comparing file *content* at origin/main's tip against
      # what this run had just regenerated, true for this release's own
      # earlier pin commit but equally true for any later, unrelated
      # commit that simply never touched these paths.
      #
      # Found in review, round 8: rather than trust "Resolve main
      # state"'s earlier answer, this step now resolves fresh - the
      # window between that step and this one (buildx/cosign setup,
      # attestation checks, digest-pin edits, compose validation, site
      # refresh) is exactly the kind of gap a revert could land in.
      # resolve_release_pin_commit itself is what actually closes the
      # revert case: identity (message/parentage/scope) alone doesn't
      # prove main's current tip still reflects a commit - a `git
      # revert` of it leaves all of that untouched while silently
      # invalidating it. Confirmed live: reverting a real pin commit
      # used to still let it resolve and get promoted/tagged/released.
      - name: Commit updated pins
        id: commit-pins
        env:
          SOURCE_REF: ${{ needs.version.outputs.source_ref }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          source scripts/lib/resolve-release-pin-commit.sh
          if git diff --quiet -- compose.release.yaml .env.release.example site/; then
            echo "compose.release.yaml, .env.release.example, and site/*.html already reflect the published release, nothing to commit"
            exit 0
          fi

          git fetch origin main
          pin_commit="$(resolve_release_pin_commit "$SOURCE_REF" "$VERSION" origin/main)"
          if [ -n "$pin_commit" ]; then
            # resolve_release_pin_commit only verifies structure (message,
            # parentage, scope, and that main's tip still matches it) - it
            # has no way to know what the *correct* pin content actually
            # is, since that depends on this run's own digests, which
            # aren't git-visible. This is the one place that can check it:
            # compare against what "Update digest pins" just regenerated.
            # Defense in depth against a forged or hand-crafted commit
            # that happens to pass every structural check above.
            if ! git diff --quiet "$pin_commit" -- compose.release.yaml .env.release.example site/; then
              echo "::error::${pin_commit} is verified as this exact release's own pin commit by message, parentage, and scope, but its content doesn't match what this run just regenerated for compose.release.yaml/.env.release.example/site/ - refusing to reuse it. Abort this release and start a fresh one instead." >&2
              exit 1
            fi
            echo "${pin_commit} is verified as this exact release's own earlier pin commit, still current on origin/main, with matching content - nothing to commit"
            echo "pin_commit=${pin_commit}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An empty result means origin/main is still exactly SOURCE_REF
          # (resolve_release_pin_commit's own first check) - re-derive
          # that here too rather than assume it, since this run's git
          # state may have moved on between the fetch above and now.
          #
          # Found in review: this used to commit locally and then
          # `git fetch origin main && git rebase origin/main` before
          # pushing - rebasing means whatever had landed on main in the
          # meantime became an ancestor of this release's own pin commit,
          # so a later re-verification could only ever check "is
          # SOURCE_REF still an ancestor", which it always trivially is
          # after a rebase onto it. The commits that landed in between were
          # never built, tested, or security-scanned by this run, yet
          # ended up folded into the tag it produces - confirmed live: a
          # real RC's tag and its own Core image's OCI revision label
          # pointed at two different commits because of exactly this.
          #
          # Refuse instead of rebasing: this release was tested against
          # SOURCE_REF specifically, so the pin commit must land as a
          # direct, single-parent child of exactly that commit or not at
          # all. If main has moved on, a plain `git push` below (no
          # rebase, no --force) is rejected as non-fast-forward by the
          # remote on its own - checked explicitly first anyway, so the
          # failure is a clear, actionable message instead of a raw git
          # rejection.
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$SOURCE_REF" ]; then
            echo "::error::origin/main has moved to ${current_main} since this release was tested against ${SOURCE_REF} - refusing to commit the pin update onto commits this run never built, tested, or security-scanned. Abort this release and start a fresh one from the current main instead." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.release.yaml .env.release.example site/
          git commit -m "$(release_pin_commit_message "$VERSION")"
          git push origin HEAD:main
          # Recorded so the next steps can act on exactly this commit,
          # instead of re-fetching origin/main again later and risking a
          # *different* race: something else landing on main in the window
          # after this push would otherwise move the tag past a commit
          # this release never actually built or tested.
          echo "pin_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Found in review, round 6: this used to run *before* the pin commit
      # above, meaning the final VERSION image tags could already be public
      # by the time that commit's own main-race check ran - an abort there
      # still burned the version number even though nothing else about the
      # release had shipped. Promotion is the one genuinely irreversible,
      # publicly-visible action in this job (a published version tag can
      # never be moved, see below); everything that can still be safely
      # aborted - candidate/attestation verification, digest-pin file
      # edits, the pin commit itself - now happens first. By the time this
      # step runs, the pin commit already exists on main (or this run
      # already found an identical one from an earlier attempt, per
      # "Commit updated pins" above), so nothing here still depends on
      # main's tip - a promotion failure here is a plain retry, not a race.
      - name: Promote candidate images to the final release tag
        env:
          VERSION: ${{ needs.version.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for image in rootguard-core rootguard-webapp rootguard-updater rootguard-unbound rootguard-blockpage rootguard-attestation-proxy; do
            digest="$(cat "/tmp/digests/${image}.digest")"
            test -n "$digest"
            source_ref="ghcr.io/${OWNER}/${image}@${digest}"
            final_ref="ghcr.io/${OWNER}/${image}:${VERSION}"

            # Final tag: create if missing, no-op if it already points at
            # this exact digest (an idempotent retry of this very step),
            # hard-abort if it points at a *different* one - a published
            # version tag must never silently start resolving to different
            # content. If ${VERSION} was already published pointing
            # elsewhere, the fix is a new version number, not overwriting
            # this one.
            existing_digest="$(docker buildx imagetools inspect "$final_ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ -n "$existing_digest" ]; then
              if [ "$existing_digest" = "$digest" ]; then
                echo "${final_ref} already points at ${digest}, nothing to promote"
                continue
              fi
              echo "::error::${image}: ${final_ref} already exists and points at ${existing_digest}, not the candidate's ${digest} - a published version tag must never be moved. Cut a new version instead of reusing ${VERSION}." >&2
              exit 1
            fi

            # imagetools create republishes the already-verified candidate
            # manifest under the final tag without rebuilding anything - so
            # the final tag ends up byte-for-byte the same multi-arch
            # manifest (same digest, same attestation, same
            # org.opencontainers.image.revision label) that "Verify
            # candidate images and attestations" above actually checked.
            docker buildx imagetools create -t "$final_ref" "$source_ref"
            promoted_digest="$(docker buildx imagetools inspect "$final_ref" --format '{{.Manifest.Digest}}')"
            if [ "$promoted_digest" != "$digest" ]; then
              echo "::error::${image}: promoted tag ${final_ref} resolved to ${promoted_digest}, expected ${digest}"
              exit 1
            fi
          done

      # This step is the only place the release tag is ever created -
      # found in review: it used to be pre-created by release-version-bump.yml
      # (or by hand for a manual workflow_dispatch) right at the start,
      # before any test/security/smoke-test/upgrade-test gate had run,
      # then *moved* here once the pin commit landed. Two real problems
      # with that: a tag existing (even briefly, pointing at an untested
      # commit) before this release had actually passed anything, and
      # moving a tag at all being indistinguishable, from the outside,
      # between "the legitimate first pin" and "something silently
      # redirected a published reference" - confirmed live:
      # v0.1.0-alpha.7's and v0.1.0-alpha.8's own tags both resolved to a
      # compose.release.yaml pinned one release behind their own name, and
      # a real RC's tag ended up pointing past commits this run never
      # tested at all (see "Commit updated pins" above). Now the tag is
      # created here, once, after every gate has passed, directly on the
      # pin commit, and is never force-moved again afterward - see below.
      # Idempotent: a no-op if the tag already points at the pinned commit.
      - name: Point the release tag at the pin-update commit
        id: point-tag
        env:
          # Set only when "Commit updated pins" actually pushed a new
          # commit - the exact one to point the tag at, no re-fetch
          # needed. Empty on its idempotent "nothing to commit" path (pins
          # already matched in the checkout at needs.version.outputs.source_ref
          # itself). Found in review: this used to fall back to
          # origin/main's *current* tip in that case, on the reasoning
          # that "nothing this release itself needs to add is missing from
          # it" - true only if main hasn't moved since this release's
          # source_ref was fixed. A retried/re-run workflow (this job can
          # legitimately re-run after e.g. a later job failed) checks that
          # reasoning again with whatever *now* happens to be on main,
          # which may by then include unrelated commits this specific
          # release run never built, tested, or security-scanned -
          # confirmed live: a real RC's tag and its own Core image's
          # OCI revision label pointed at two different commits because of
          # exactly this. SOURCE_REF is the one thing every job in this
          # run actually agrees on (see the "version" job's own comment on
          # why it exists) - use it instead, and verify it's still part of
          # main's history rather than trusting it blindly.
          PIN_COMMIT: ${{ steps.commit-pins.outputs.pin_commit }}
          SOURCE_REF: ${{ needs.version.outputs.source_ref }}
        run: |
          set -euo pipefail
          tag="v${{ needs.version.outputs.value }}"
          git fetch origin main
          if [ -n "$PIN_COMMIT" ]; then
            target="$PIN_COMMIT"
          else
            target="$(git rev-parse "${SOURCE_REF}")"
            if ! git merge-base --is-ancestor "${target}" origin/main; then
              echo "::error::Release ${{ needs.version.outputs.value }} was built and tested from ${target}, which is no longer part of origin/main - main has moved on since this release run started. Refusing to tag a commit this release never actually built/tested/security-scanned. Abort this release and start a fresh one instead." >&2
              exit 1
            fi
          fi
          # Recorded as a step output either way (before the idempotent
          # early-exit below) - the release notes' "Build provenance"
          # section needs it regardless of whether this run actually moved
          # the tag or found it already correct.
          echo "pin_commit=${target}" >> "$GITHUB_OUTPUT"
          # "refs/tags/${tag}" alone resolves an *annotated* tag (which
          # `git tag -a` below always creates) to the tag object's own
          # hash, not the commit it points at - found in review: that made
          # this comparison fail on every single run, so this step force-
          # moved the tag every time regardless of whether it actually
          # needed to, and any accidental extra run (a retry, a re-dispatch
          # for the same version) could silently force-push it onto a
          # different commit. "^{}" dereferences through the tag object to
          # the commit it points at, same as `git rev-parse` does for every
          # other object type already.
          if git rev-parse "refs/tags/${tag}^{}" >/dev/null 2>&1; then
            existing="$(git rev-parse "refs/tags/${tag}^{}")"
            if [ "$existing" = "${target}" ]; then
              echo "Tag ${tag} already points at the correctly pinned commit"
              exit 0
            fi
            # Found in review: this used to force-move the tag onto
            # ${target} unconditionally whenever it didn't already match -
            # legitimate the very first time a release's tag gets pinned
            # (release-version-bump.yml no longer pre-creates it, so this
            # step is now the only place the tag is ever created at all),
            # but indistinguishable from a genuinely published tag being
            # silently redirected onto different content on any later,
            # unexpected mismatch. A published tag must never move once
            # created - never --force here, under any circumstance; if
            # ${tag} is wrong, that needs a real fix (a new version, or a
            # deliberate by-hand correction), not this workflow silently
            # papering over it.
            echo "::error::Tag ${tag} already exists and points at ${existing}, not the expected ${target} - refusing to move a published tag. If this is a genuine correction, fix it by hand and re-run; this workflow will never force-move a tag." >&2
            exit 1
          fi
          git tag -a "${tag}" -m "${{ needs.version.outputs.value }}" "${target}"
          git push origin "refs/tags/${tag}"

      # The GitHub Release is created here, not by release-version-bump.yml
      # (which used to create it immediately after tagging, before this
      # workflow had even started) - found in review: a failed
      # smoke-test/upgrade-test still left a real, publicly visible Release
      # behind needing manual cleanup, and since Core's/install.sh's live
      # release discovery both query the Releases API (not raw git tags), a
      # published-but-broken Release was immediately eligible to be
      # auto-discovered as "latest" by any existing installation. Notes are
      # regenerated here (not passed from release-version-bump.yml, a
      # separate workflow run) since git-cliff's output is fully
      # deterministic from commit history - identical range, identical
      # result.
      - name: Determine the previous release tag for changelog notes
        id: previous-tag
        run: |
          set -euo pipefail
          source scripts/lib/semver-validate.sh
          previous="$(git for-each-ref 'refs/tags/v*' --sort=-creatordate --format='%(refname:short)' \
            | grep -E "^v${SEMVER_PATTERN#^}" \
            | grep -v "^v${{ needs.version.outputs.value }}\$" \
            | head -1 || true)"
          echo "value=${previous}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        env:
          # Matches GIT_CLIFF_VERSION above - update together if that ever
          # changes (sha256sum of the .tar.gz asset for that version).
          GIT_CLIFF_SHA256: 9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546
        run: |
          set -euo pipefail
          curl -fsSL -o git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  git-cliff.tar.gz" | sha256sum -c -
          tar -xzf git-cliff.tar.gz "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          install "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff

      - name: Generate release notes
        run: |
          set -euo pipefail
          range="HEAD"
          [ -n "${{ steps.previous-tag.outputs.value }}" ] && range="${{ steps.previous-tag.outputs.value }}..HEAD"
          git-cliff --config cliff.toml --tag "v${{ needs.version.outputs.value }}" \
            "$range" --strip header -o /tmp/release-notes.md

      # Found in review: the tag this release publishes under (moved above,
      # to the pin-update commit, so the documented quick start resolves to
      # the right compose.release.yaml/.env.release.example) is never the
      # commit the published images were actually built from - that build
      # happened in the publish job, against the commit this whole workflow
      # run started at, one commit *before* the pin update it doesn't and
      # can't include yet (the pin needs the digests the build produces).
      # Each image's own org.opencontainers.image.revision label and
      # provenance attestation reference that earlier commit, not the tag -
      # a real, structural gap for anyone trying to trace a published image
      # back to source without already knowing this. Not fixable by
      # skipping the tag move (that's the RC-blocker this reverts to) or by
      # building from the pin commit (impossible: chicken-and-egg on the
      # digests) - recorded explicitly instead, so it's a one-line lookup
      # rather than something to reverse-engineer from git history.
      - name: Append build provenance to the release notes
        run: |
          set -euo pipefail
          {
            echo
            echo "## Build provenance"
            echo
            echo "- Published images were built from commit \`${{ needs.version.outputs.source_ref }}\` - matches each image's \`org.opencontainers.image.revision\` label and provenance attestation."
            echo "- This tag (\`v${{ needs.version.outputs.value }}\`) points at \`${{ steps.point-tag.outputs.pin_commit }}\`, one commit ahead - the pin update that records this release's own image digests in \`compose.release.yaml\`/\`.env.release.example\`."
          } >> /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ needs.version.outputs.value }}"
          # Idempotent, matching every other step in this job: a re-run
          # against an already-published version (e.g. re-running after a
          # transient upgrade-test failure was fixed, as happened live for
          # 1.0.0-rc.1) must not fail here just because the Release from an
          # earlier run already exists.
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          # A bare "X.Y.Z" (no "-" suffix) is a stable release and must
          # not be marked as a prerelease on GitHub - only relevant once
          # 1.0.0 itself ships (every version so far has had a suffix),
          # but wrong by default otherwise: gh release create always
          # applies whatever flag is passed, it doesn't infer this itself.
          prerelease_flag=()
          case "${{ needs.version.outputs.value }}" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.value }}" \
            --notes-file /tmp/release-notes.md \
            "${prerelease_flag[@]}"

      # GitHub never auto-triggers another workflow's "on: push" from a
      # push made with the built-in GITHUB_TOKEN (the same anti-recursion
      # rule release-version-bump.yml already works around for tag
      # pushes) - so the "Commit updated pins" push above, even though it
      # touches site/**, never starts pages.yml on its own. Dispatch it
      # explicitly so the live site actually reflects this release
      # instead of silently waiting for the next 6-hourly cron run.
      # Idempotent: redeploying already-current content is harmless.
      - name: Deploy the refreshed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  smoke-test:
    needs: [version, publish, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # candidate_tag, not value - the final version tag doesn't exist yet
      # at this point (see the publish job's own comment on why): this test
      # must run against exactly what publish just built, before promotion.
      ROOTGUARD_CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_WEBAPP_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-updater:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_UNBOUND_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-unbound:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_UNBOUND_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-unbound:${{ needs.version.outputs.candidate_tag }}
      # Found in review: missing entirely, so this job's deploy below ran
      # with BlockpageEnabled left off (see the deploy config right below)
      # and the blockpage image - built and published by the very same
      # publish job as everything else here - was never actually deployed,
      # attested, or smoke-tested by any release. A broken blockpage image
      # could ship undetected.
      ROOTGUARD_BLOCKPAGE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-blockpage:${{ needs.version.outputs.candidate_tag }}
      # Also new this round: without this, the deploy below would fall
      # back to compose.release.yaml's own placeholder default pin (not
      # a real, pullable image yet at this point) instead of the
      # candidate publish just built.
      ROOTGUARD_ATTESTATION_PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-attestation-proxy:${{ needs.version.outputs.candidate_tag }}
      ROOTGUARD_API_TOKEN: alpha-smoke-test-token-not-a-real-secret-32
      ROOTGUARD_ADMIN_USER: admin
      ROOTGUARD_ADMIN_PASSWORD: alpha-smoke-test-password
      ROOTGUARD_RECOVERY_TOKEN: alpha-smoke-test-recovery-token-not-a-real-secret-32
      ROOTGUARD_WEB_BIND: 127.0.0.1
      ROOTGUARD_WEB_PORT: "18080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Found in review: the dig checks below used to query real internet
      # domains (example.com, dnssec-failed.org) directly - a transient
      # DNS/network hiccup on the runner's own connection then fails a
      # release for reasons that have nothing to do with the code under
      # test. Confirmed live: main's own independent, scheduled CI failed
      # this way. setup.sh signs a small throwaway zone fresh every run
      # and serves it locally; inject.sh (below, after Unbound is deployed
      # and running) is what wires it up.
      - name: Start local DNSSEC test authority
        run: ./scripts/ci/dnssec-test-zone/setup.sh
      - name: Start published control plane
        run: docker compose -f compose.release.yaml up -d
      - name: Install and verify the DNS stack
        run: |
          for attempt in {1..60}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie-jar /tmp/rootguard-alpha-cookies.txt \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"alpha-smoke-test-password"}' \
              http://127.0.0.1:18080/api/auth/login || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200
          # blockpage_enabled: true - see the env block's own comment on
          # ROOTGUARD_BLOCKPAGE_IMAGE above for why this must actually be
          # turned on here, not left at its default off.
          config='{"dns_bind_address":"127.0.0.1","dns_port":1053,"blockpage_enabled":true}'
          test "$(curl --fail --silent --cookie /tmp/rootguard-alpha-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18080/api/installation/preflight | jq -r .ready)" = true
          curl --fail --silent --cookie /tmp/rootguard-alpha-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18080/api/installation/deploy >/dev/null
          for attempt in {1..90}; do
            installation="$(curl --fail --silent \
              --cookie /tmp/rootguard-alpha-cookies.txt \
              http://127.0.0.1:18080/api/installation)"
            state="$(jq -r .state <<<"$installation")"
            if [ "$state" = installed ]; then break; fi
            if [ "$state" = failed ]; then echo "$installation"; exit 1; fi
            sleep 2
          done
          test "$state" = installed
          ./scripts/ci/dnssec-test-zone/inject.sh rootguard-unbound
          for attempt in {1..30}; do
            if test "$(docker inspect --format '{{.State.Health.Status}}' rootguard-unbound)" = "healthy"; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' rootguard-unbound)" = "healthy"
          test -n "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1053 good.rgtest-ci.internal A)"
          test "$(dig +dnssec +time=5 +tries=2 @127.0.0.1 -p 1053 \
            bad.rgtest-ci.internal A | sed -n \
            's/^;; ->>HEADER<<- opcode: QUERY, status: \([^,]*\).*/\1/p')" = SERVFAIL
          # Blockpage binds on config.DNSBindAddress:80 once
          # blockpage_enabled deploys it (see installer.Manager's
          # blockpagePort) - confirms the published blockpage candidate
          # image actually starts and serves its real page, not just that
          # it built.
          test "$(curl --fail --silent http://127.0.0.1:80/ | grep -c 'RootGuard')" -gt 0
          # Found in review: the check above only ever proved the static
          # HTML page loads - /api/reason (the actual live-data endpoint,
          # proxying through Core with the shared BLOCKPAGE_SERVICE_TOKEN
          # - see blockpage.conf.template's own comment) was published and
          # deployed but never exercised by this smoke test. A broken
          # token hand-off, a broken proxy_pass, or a broken Core-side
          # /api/blockpage/reason route could all have shipped undetected.
          # nginx's @reason_unavailable fallback (any upstream failure)
          # returns {"available":false} with no "reason" key - asserting a
          # real, non-empty "reason" for a plain, unblocked domain proves
          # the whole chain (nginx auth -> Core auth -> AdGuard query)
          # actually works end to end, not just that each piece deployed.
          reason_response="$(curl --fail --silent -H 'Host: example.com' http://127.0.0.1:80/api/reason)"
          test -n "$(jq -r '.reason // empty' <<<"$reason_response")"
      - name: Show logs after failure
        if: failure()
        run: docker compose -f compose.release.yaml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.release.yaml down --volumes

  # Proves the actual upgrade path an operator running the previous release
  # would take, not just a fresh install of the new one: deploy the
  # immediately preceding published release exactly as it shipped, verify
  # its DNS chain, then upgrade it in place through the real control-plane
  # updater (never a synthetic fixture) to the version just published here,
  # and verify DNS still works afterward. "Previous" is scoped to the one
  # release directly before this one - RootGuard is pre-1.0 alpha and
  # doesn't yet promise compatibility further back than that.
  upgrade-test:
    needs: [version, publish, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      # See smoke-test's own comment on this exact step - the dig checks
      # below have the same real-internet-dependency problem, confirmed
      # live the same way.
      - name: Start local DNSSEC test authority
        run: ./scripts/ci/dnssec-test-zone/setup.sh

      - name: Determine the previous published release
        id: previous
        run: |
          set -euo pipefail
          source scripts/lib/semver-validate.sh
          # Sort by actual tag creation date across every release tag
          # (any scheme, not just today's v0.1.0-(alpha|beta).N) rather
          # than a trailing-number sort - the latter always resolved to
          # the highest alpha.N tag even once the beta series existed,
          # silently testing an upgrade from a much older release than the
          # one directly before this one, and wouldn't survive a future
          # base-version change at all.
          #
          # Found in review: this filter used to hand-write its own copy
          # of the SemVer-tag regex, missing the hyphen SemVer allows
          # inside a prerelease identifier - a real tag like
          # v1.2.3-rc-hotfix.1 was invisible to it, silently testing an
          # upgrade from (or skipping the upgrade test entirely in favor
          # of) an older release than the one actually directly before
          # this one. Reusing $SEMVER_PATTERN (sourced above, the same
          # grammar require_semver enforces on every version this
          # pipeline ever creates) instead of a second hand-written copy.
          previous_version="$(git for-each-ref 'refs/tags/v*' --sort=-creatordate \
            --format='%(refname:short)' \
            | grep -E "^v${SEMVER_PATTERN#^}" \
            | grep -v "^v${{ needs.version.outputs.value }}\$" \
            | head -1 | sed 's/^v//' || true)"
          if [ -z "${previous_version}" ]; then
            echo "No previous release exists yet - nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Not the tag itself: it points at the commit where the release was
          # cut, before the pin-update commit that follows it - so, absent
          # this release's own "Point the release tag at the pin-update
          # commit" step (only self-healing for releases cut after that step
          # existed), the tag's own compose.release.yaml can still be pinned to
          # the release *before* it. Searching history for the actual pin
          # commit is correct regardless of whether the tag was ever moved.
          # --follow and the alpha/release alternation handle a previous
          # release cut before the compose.alpha.yaml -> compose.release.yaml
          # rename; the message pattern tolerates both the pre- and
          # post-#298 commit wording ("pin X to V image digests" vs.
          # "ci: pin X, Y, and Z to V") since only the "pin ... to V" core
          # is common to both.
          escaped_version="${previous_version//./\\.}"
          pin_commit="$(git log --format='%H %s' --follow -- compose.release.yaml \
            | grep -iE "pin compose\.(alpha|release)\.yaml.*to ${escaped_version}" \
            | head -1 | cut -d' ' -f1 || true)"
          if [ -z "${pin_commit}" ]; then
            echo "No pin-update commit found for ${previous_version} - nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The historical compose filename may differ from today's
          # convention if the previous release predates a rename - detect
          # which one actually exists in that commit's tree instead of
          # assuming the current name.
          if git cat-file -e "${pin_commit}:compose.release.yaml" 2>/dev/null; then
            pin_compose_path="compose.release.yaml"
          elif git cat-file -e "${pin_commit}:compose.alpha.yaml" 2>/dev/null; then
            pin_compose_path="compose.alpha.yaml"
          else
            echo "Neither compose.release.yaml nor compose.alpha.yaml exists at ${pin_commit} - nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "commit=${pin_commit}" >> "$GITHUB_OUTPUT"
          echo "compose_path=${pin_compose_path}" >> "$GITHUB_OUTPUT"
          echo "version=${previous_version}" >> "$GITHUB_OUTPUT"

      - name: Extract the previous release's correctly pinned Compose model
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git show "${{ steps.previous.outputs.commit }}:${{ steps.previous.outputs.compose_path }}" > compose.release.yaml
          # A previous release predating the compose.alpha.yaml ->
          # compose.release.yaml rename bind-mounts and self-references
          # itself under its own historical name (the updater container's
          # ROOTGUARD_COMPOSE_FILE and volume mount) - keep a copy under
          # that name too so the extracted file's own internal references
          # still resolve, even though every docker compose invocation
          # below uses the canonical compose.release.yaml name.
          if [ "${{ steps.previous.outputs.compose_path }}" != "compose.release.yaml" ]; then
            cp compose.release.yaml "${{ steps.previous.outputs.compose_path }}"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.previous.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the previous release exactly as it shipped
        if: steps.previous.outputs.skip != 'true'
        env:
          # No *_IMAGE overrides here - the previous release's own compose
          # file already pins its own images by digest. Only the *_UPDATE_IMAGE
          # pair is overridden, to the candidate image publish just built
          # (not yet the final version tag - that doesn't exist until
          # promotion, after this test passes), so the upgrade step below
          # has something real to move to.
          ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.candidate_tag }}
          ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.candidate_tag }}
          ROOTGUARD_API_TOKEN: alpha-upgrade-test-token-not-a-real-secret-32
          ROOTGUARD_ADMIN_USER: admin
          ROOTGUARD_ADMIN_PASSWORD: alpha-upgrade-test-password
          ROOTGUARD_RECOVERY_TOKEN: alpha-upgrade-test-recovery-token-not-a-real-secret-32
          ROOTGUARD_WEB_BIND: 127.0.0.1
          ROOTGUARD_WEB_PORT: "18082"
        run: docker compose -f compose.release.yaml up -d

      - name: Install the previous release and verify DNS
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie-jar /tmp/rootguard-upgrade-cookies.txt \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"alpha-upgrade-test-password"}' \
              http://127.0.0.1:18082/api/auth/login || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200
          config='{"dns_bind_address":"127.0.0.1","dns_port":1055}'
          test "$(curl --fail --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18082/api/installation/preflight | jq -r .ready)" = true
          curl --fail --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18082/api/installation/deploy >/dev/null
          for attempt in {1..90}; do
            installation="$(curl --fail --silent \
              --cookie /tmp/rootguard-upgrade-cookies.txt \
              http://127.0.0.1:18082/api/installation)"
            state="$(jq -r .state <<<"$installation")"
            if [ "$state" = installed ]; then break; fi
            if [ "$state" = failed ]; then echo "$installation"; exit 1; fi
            sleep 2
          done
          test "$state" = installed
          ./scripts/ci/dnssec-test-zone/inject.sh rootguard-unbound
          for attempt in {1..30}; do
            if test "$(docker inspect --format '{{.State.Health.Status}}' rootguard-unbound)" = "healthy"; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' rootguard-unbound)" = "healthy"
          test -n "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1055 good.rgtest-ci.internal A)"

      - name: Upgrade in place through the real control-plane updater
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          poll_status() {
            local body code curl_status
            set +e
            body="$(curl --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
              --write-out '\n%{http_code}' http://127.0.0.1:18082/api/control-plane-updates)"
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              return 0
            fi
            code="${body##*$'\n'}"
            body="${body%$'\n'*}"
            if [ "${code:0:1}" != 2 ]; then
              echo "::error::GET /api/control-plane-updates returned HTTP ${code}: ${body}" >&2
              exit 1
            fi
            echo "$body"
          }
          for attempt in {1..30}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18082/ || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
            sleep 1
          done
          # The previous release's own Core resolves "latest core/webapp
          # release" itself and sends that as the target_images override -
          # which wins over the updater's own correctly-set
          # ROOTGUARD_*_UPDATE_IMAGE env vars (see targetImageFor in
          # rootguard-updater/main.go). A previous release whose Core still
          # carries an older/buggy release-discovery implementation - the
          # ordering bug fixed in PR #355, the RootGuard-specific
          # "alpha|beta.N" scheme replaced by full SemVer in PR #359, or
          # whatever the next one turns out to be - can therefore resolve
          # to the wrong release, deep-linking straight past whatever this
          # job is actually testing. Structural, not a one-off: a fix
          # shipped *in* a release can never help the one jump *onto* that
          # release, because the resolution during that specific
          # transition is still performed by the pre-fix code of whichever
          # release is "previous" - confirmed live twice now (the
          # beta.12->beta.13 jump, then this same class again on
          # beta.14->1.0.0-rc.1, the exact transition that first ships the
          # SemVer generalization). Always bypass Core's live resolution
          # here and call the updater directly with an explicit override
          # instead of trying to special-case each specific previous
          # version as it's discovered - this job already knows exactly
          # which version it's testing, so there's no reason to depend on
          # Core's own auto-discovery at all here (that's covered directly
          # by its own Go unit tests). Still exercises the same real
          # updater/pull/digest/compose/verify/rollback path either way -
          # only where the *target* tag comes from differs.
          target_body='{"target_images":{"core":"ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.candidate_tag }}","webapp":"ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.candidate_tag }}"}}'
          docker exec rootguard-core wget -qO- \
            --header='Authorization: Bearer alpha-upgrade-test-token-not-a-real-secret-32' \
            --header='Content-Type: application/json' \
            --post-data="$target_body" \
            http://updater:8082/api/control-plane/check >/dev/null
          state=""
          for attempt in {1..90}; do
            status="$(poll_status)"
            if [ -z "$status" ]; then sleep 2; continue; fi
            state="$(jq -r .state <<<"$status")"
            if [ "$state" = idle ]; then break; fi
            if [ "$state" = failed ]; then echo "$status"; exit 1; fi
            sleep 2
          done
          test "$state" = idle
          docker exec rootguard-core wget -qO- \
            --header='Authorization: Bearer alpha-upgrade-test-token-not-a-real-secret-32' \
            --header='Content-Type: application/json' \
            --post-data="$target_body" \
            http://updater:8082/api/control-plane/update >/dev/null
          # The install swaps the Core and WebApp containers themselves, so
          # the WebApp is expected to be briefly unreachable mid-poll here -
          # unlike everywhere else in this step, that's not a failure.
          state=""
          for attempt in {1..90}; do
            status="$(poll_status)"
            if [ -z "$status" ]; then sleep 2; continue; fi
            state="$(jq -r .state <<<"$status")"
            if [ "$state" = idle ]; then break; fi
            if [ "$state" = failed ]; then echo "$status"; exit 1; fi
            sleep 2
          done
          test "$state" = idle
          echo "$status"
          echo "$status" | jq -r '.history[0].outcome' | grep -qx success || { echo "$status"; exit 1; }

      - name: Verify the running images match the newly built candidate
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for pair in "rootguard-core:core" "rootguard-webapp:webapp"; do
            container="${pair%%:*}"
            image="${pair##*:}"
            release_ref="ghcr.io/${{ github.repository_owner }}/rootguard-${image}:${{ needs.version.outputs.candidate_tag }}"
            # The updater itself never relies on a local tag existing (see
            # the digestFromPullOutput fix) - it works entirely off the
            # digest docker pull reports. This check shouldn't assume one
            # either: pull the release tag fresh right here, rather than
            # trusting that some earlier step in this job happened to leave
            # a matching local tag behind as a side effect.
            docker pull "$release_ref" >/dev/null
            expected="$(docker image inspect "$release_ref" --format '{{.Id}}')"
            actual="$(docker inspect "$container" --format '{{.Image}}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${container}: running image ${actual} does not match freshly-pulled ${release_ref} (${expected})"
              docker inspect "$container" --format 'running RepoDigests: {{.Config.Image}}'
              docker image inspect "$release_ref" --format 'release RepoDigests: {{range .RepoDigests}}{{.}} {{end}}'
              exit 1
            fi
          done

      - name: Verify DNS still works after the upgrade
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          test -n "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1055 good.rgtest-ci.internal A)"
          test "$(dig +dnssec +time=5 +tries=2 @127.0.0.1 -p 1055 \
            bad.rgtest-ci.internal A | sed -n \
            's/^;; ->>HEADER<<- opcode: QUERY, status: \([^,]*\).*/\1/p')" = SERVFAIL

      # Found in review: self-update never re-fetches compose.release.yaml
      # (docs/release-process.md, "Self-update can never deliver a
      # compose-topology change") - the core/updater containers this job
      # just upgraded to already run the new, attestation-gated code, but
      # on the *previous* release's own topology (no
      # rootguard-attestation-proxy service, no `egress` network, no
      # ROOTGUARD_ATTESTATION_PROXY_URL). This is exactly that scenario,
      # for real, not simulated - logged explicitly so it stays visible
      # on every release cut rather than silently relying on the unit
      # tests covering RequireAttestation's/verifyAttestation's own
      # proxy pre-check (rootguard-core/internal/stack/attestation_test.go,
      # rootguard-updater/attestation_test.go) to be the only place this
      # is ever exercised. Informational, not a failing assertion - the
      # gap itself is known and accepted (see docs/release-process.md),
      # not something this job is meant to catch as a regression.
      - name: Log the known post-upgrade topology gap
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          proxy_url="$(docker exec rootguard-core printenv ROOTGUARD_ATTESTATION_PROXY_URL 2>/dev/null || true)"
          if [ -z "$proxy_url" ]; then
            echo "::notice::Known, accepted gap (docs/release-process.md): the just-upgraded rootguard-core has no ROOTGUARD_ATTESTATION_PROXY_URL, because self-update never delivers a compose-topology change - any further attestation-gated update from here would fail with a clear, specific error (see RequireAttestation's own proxy pre-check) rather than a silent success or an opaque hang."
          else
            echo "::notice::rootguard-core now reports ROOTGUARD_ATTESTATION_PROXY_URL=${proxy_url} after the upgrade - the topology gap this step exists to surface may have closed; consider whether docs/release-process.md's own note is still accurate."
          fi

      - name: Show logs after failure
        if: failure() && steps.previous.outputs.skip != 'true'
        env:
          ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.candidate_tag }}
          ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.candidate_tag }}
          ROOTGUARD_API_TOKEN: alpha-upgrade-test-token-not-a-real-secret-32
          ROOTGUARD_ADMIN_USER: admin
          ROOTGUARD_ADMIN_PASSWORD: alpha-upgrade-test-password
          ROOTGUARD_RECOVERY_TOKEN: alpha-upgrade-test-recovery-token-not-a-real-secret-32
          ROOTGUARD_WEB_BIND: 127.0.0.1
          ROOTGUARD_WEB_PORT: "18082"
        run: docker compose -f compose.release.yaml logs --no-color

      - name: Stop stack
        if: always() && steps.previous.outputs.skip != 'true'
        env:
          ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.candidate_tag }}
          ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.candidate_tag }}
          ROOTGUARD_API_TOKEN: alpha-upgrade-test-token-not-a-real-secret-32
          ROOTGUARD_ADMIN_USER: admin
          ROOTGUARD_ADMIN_PASSWORD: alpha-upgrade-test-password
          ROOTGUARD_RECOVERY_TOKEN: alpha-upgrade-test-recovery-token-not-a-real-secret-32
          ROOTGUARD_WEB_BIND: 127.0.0.1
          ROOTGUARD_WEB_PORT: "18082"
        run: docker compose -f compose.release.yaml down --volumes
