name: Publish RootGuard release images

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: 0.1.0-alpha.4

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.release.outputs.value }}
    steps:
      - id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            *-alpha.*|*-beta.*) ;;
            *) echo "Refusing non-alpha/non-beta version: $version" >&2; exit 1 ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rootguard-core/go.mod
          cache: false
      - run: go test ./...
        working-directory: rootguard-core
      - run: go test ./...
        working-directory: rootguard-updater
      - run: go test ./...
        working-directory: rootguard-webapp/backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rootguard-webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: rootguard-webapp/frontend
      - run: npm run lint
        working-directory: rootguard-webapp/frontend
      - run: npm run build
        working-directory: rootguard-webapp/frontend

  publish:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            image: rootguard-core
            context: rootguard-core
          - component: webapp
            image: rootguard-webapp
            context: rootguard-webapp
          - component: updater
            image: rootguard-updater
            context: rootguard-updater
          - component: unbound
            image: rootguard-unbound
            context: rootguard-unbound
          - component: blockpage
            image: rootguard-blockpage
            context: rootguard-blockpage
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an immutable existing release image
        id: existing
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.value }}
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine build timestamp
        id: build-time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: push
        if: steps.existing.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.value }}
          # Deliberately no org.opencontainers.image.version here: every
          # Dockerfile already sets it from a build-arg (VERSION below for
          # core/webapp/updater/blockpage, whose own software version is the
          # release version) - except rootguard-unbound's, which sets it from
          # its own UNBOUND_VERSION default (the actual resolver version,
          # e.g. 1.25.2). Passing it here as an extra label would win over
          # the Dockerfile's own LABEL for the same key on every image,
          # silently overwriting unbound's intentionally different value
          # with the RootGuard release tag.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.value }}
          build-args: |
            VERSION=${{ needs.version.outputs.value }}
            COMMIT=${{ github.sha }}
      - name: Attest published image provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Runs unconditionally, not just on a fresh push - steps.push.outputs.digest
      # is only set when the build actually ran (see "Check for an immutable
      # existing release image" above), so a re-run against an already-published
      # version falls back to looking the digest up directly from the registry.
      # compose.release.yaml's pins need a real digest either way.
      - name: Record published digest
        id: digest
        if: matrix.component != 'blockpage'
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.value }}
        run: |
          if [ -n "${{ steps.push.outputs.digest }}" ]; then
            digest="${{ steps.push.outputs.digest }}"
          else
            digest="$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{.Manifest.Digest}}')"
          fi
          mkdir -p /tmp/digests
          printf '%s' "$digest" > "/tmp/digests/${{ matrix.image }}.digest"

      - uses: actions/upload-artifact@v4
        if: matrix.component != 'blockpage'
        with:
          name: digest-${{ matrix.component }}
          path: /tmp/digests/${{ matrix.image }}.digest

  # compose.release.yaml and .env.release.example are the pinned, no-build public
  # release model - their default/documented image references need to track
  # whatever publish just pushed, or every fresh clone silently keeps running
  # the *previous* release's digests forever. .env.release.example is what the
  # quick start actually tells users to download as their .env, and its
  # values there take precedence over compose.release.yaml's own defaults - so
  # both files must be kept in lockstep, not just the compose file. blockpage
  # is excluded: it isn't referenced in either file at all (Core provisions
  # it dynamically), so there's nothing here to update for it.
  update-alpha-pins:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Update digest pins
        env:
          VERSION: ${{ needs.version.outputs.value }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for file in compose.release.yaml .env.release.example; do
            for image in rootguard-core rootguard-webapp rootguard-updater rootguard-unbound; do
              digest="$(cat "/tmp/digests/${image}.digest")"
              test -n "$digest"
              # [^@\"}] - not just [^@\"] - because ROOTGUARD_UPDATER_UPDATE_IMAGE
              # is the one *_UPDATE_IMAGE line whose default fallback has no
              # pre-existing @sha256: digest (it's an intentionally unpinned
              # :latest, see compose.release.yaml's own comment on that line).
              # Without excluding "}" too, the greedy match swallowed the
              # closing brace of the surrounding ${VAR:-default}" wrapper on
              # v0.1.0-beta.5's cut, breaking the file's YAML syntax outright
              # (caught live, not by CI - docker compose config never ran
              # against this exact committed pin-refresh commit).
              sed -i -E "s#(ghcr\.io/${OWNER}/${image}:)[^@\"}]+(@sha256:[0-9a-f]+)?#\1${VERSION}@${digest}#g" "$file"
            done
            # Keep the descriptive header comment's version number in sync too -
            # left stale after alpha.7 since only the image pins were automated.
            # Matches any -<series>.<N> suffix (alpha/beta/rc/...), not just
            # alpha, so it keeps working across series transitions. Delimiter
            # is | rather than the usual # since # is both the sed delimiter
            # convention used above and a literal character in the comment
            # line itself being matched here.
            sed -i -E "s|^(# RootGuard )[0-9]+\.[0-9]+\.[0-9]+-[a-z]+\.[0-9]+|\1${VERSION}|" "$file"
          done

      # site/*.html's version references went stale twice in the two days
      # after v0.1.0-beta.2 and v0.1.0-beta.3 each shipped - nothing here
      # ever touched them, only compose.release.yaml/.env.release.example.
      # bump-site-versions.sh runs the exact same logic
      # check-site-facts.sh checks for, so this and that check can never
      # drift apart. Idempotent: a no-op when the site already matches.
      - name: Refresh site/*.html version references
        run: ./scripts/bump-site-versions.sh

      # The pin commit below carries [skip ci] (a mechanical, low-risk
      # pin-only commit shouldn't re-trigger the whole CI matrix), which
      # means ci.yml's own check-site-facts.sh run would never see it -
      # verify right here instead, so a gap in bump-site-versions.sh fails
      # this workflow loudly instead of shipping an unverified site.
      - name: Verify site facts are current
        run: ./scripts/check-site-facts.sh

      - name: Commit updated pins
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- compose.release.yaml .env.release.example site/; then
            echo "compose.release.yaml, .env.release.example, and site/*.html already reflect the published release, nothing to commit"
            exit 0
          fi
          git add compose.release.yaml .env.release.example site/
          git commit -m "ci: pin compose.release.yaml, .env.release.example, and site/*.html to ${{ needs.version.outputs.value }} [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # The release tag is created before this job ever runs (by
      # release-version-bump.yml, or by hand for a workflow_dispatch run),
      # so without this step it permanently points at a commit whose
      # compose.release.yaml still pins the *previous* release's images -
      # confirmed live: v0.1.0-alpha.7's and v0.1.0-alpha.8's own tags both
      # resolve to a compose.release.yaml pinned one release behind their own
      # name. Anyone following the documented quick start
      # ("curl .../v0.1.0-alpha.N/compose.release.yaml") got the wrong images.
      # Moving the tag here, once, right after the pin commit that
      # completes *this* release, keeps it self-consistent going forward.
      # Idempotent: a no-op if the tag already points at the pinned commit.
      - name: Point the release tag at the pin-update commit
        run: |
          set -euo pipefail
          tag="v${{ needs.version.outputs.value }}"
          git fetch origin main
          target="$(git rev-parse origin/main)"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1 && \
             [ "$(git rev-parse "refs/tags/${tag}")" = "${target}" ]; then
            echo "Tag ${tag} already points at the correctly pinned commit"
            exit 0
          fi
          git tag -f -a "${tag}" -m "${{ needs.version.outputs.value }}" "${target}"
          git push --force origin "refs/tags/${tag}"

      # GitHub never auto-triggers another workflow's "on: push" from a
      # push made with the built-in GITHUB_TOKEN (the same anti-recursion
      # rule release-version-bump.yml already works around for tag
      # pushes) - so the "Commit updated pins" push above, even though it
      # touches site/**, never starts pages.yml on its own. Dispatch it
      # explicitly so the live site actually reflects this release
      # instead of silently waiting for the next 6-hourly cron run.
      # Idempotent: redeploying already-current content is harmless.
      - name: Deploy the refreshed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  smoke-test:
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      ROOTGUARD_CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.value }}
      ROOTGUARD_WEBAPP_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.value }}
      ROOTGUARD_UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-updater:${{ needs.version.outputs.value }}
      ROOTGUARD_UNBOUND_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-unbound:${{ needs.version.outputs.value }}
      ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.value }}
      ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.value }}
      ROOTGUARD_UNBOUND_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-unbound:${{ needs.version.outputs.value }}
      ROOTGUARD_API_TOKEN: alpha-smoke-test-token-not-a-real-secret-32
      ROOTGUARD_ADMIN_USER: admin
      ROOTGUARD_ADMIN_PASSWORD: alpha-smoke-test-password
      ROOTGUARD_RECOVERY_TOKEN: alpha-smoke-test-recovery-token-not-a-real-secret-32
      ROOTGUARD_WEB_BIND: 127.0.0.1
      ROOTGUARD_WEB_PORT: "18080"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start published control plane
        run: docker compose -f compose.release.yaml up -d
      - name: Install and verify the DNS stack
        run: |
          for attempt in {1..60}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie-jar /tmp/rootguard-alpha-cookies.txt \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"alpha-smoke-test-password"}' \
              http://127.0.0.1:18080/api/auth/login || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200
          config='{"dns_bind_address":"127.0.0.1","dns_port":1053}'
          test "$(curl --fail --silent --cookie /tmp/rootguard-alpha-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18080/api/installation/preflight | jq -r .ready)" = true
          curl --fail --silent --cookie /tmp/rootguard-alpha-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18080/api/installation/deploy >/dev/null
          for attempt in {1..90}; do
            installation="$(curl --fail --silent \
              --cookie /tmp/rootguard-alpha-cookies.txt \
              http://127.0.0.1:18080/api/installation)"
            state="$(jq -r .state <<<"$installation")"
            if [ "$state" = installed ]; then break; fi
            if [ "$state" = failed ]; then echo "$installation"; exit 1; fi
            sleep 2
          done
          test "$state" = installed
          test -n "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1053 example.com A)"
          test "$(dig +dnssec +time=5 +tries=2 @127.0.0.1 -p 1053 \
            dnssec-failed.org A | sed -n \
            's/^;; ->>HEADER<<- opcode: QUERY, status: \([^,]*\).*/\1/p')" = SERVFAIL
      - name: Show logs after failure
        if: failure()
        run: docker compose -f compose.release.yaml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.release.yaml down --volumes

  # Proves the actual upgrade path an operator running the previous release
  # would take, not just a fresh install of the new one: deploy the
  # immediately preceding published release exactly as it shipped, verify
  # its DNS chain, then upgrade it in place through the real control-plane
  # updater (never a synthetic fixture) to the version just published here,
  # and verify DNS still works afterward. "Previous" is scoped to the one
  # release directly before this one - RootGuard is pre-1.0 alpha and
  # doesn't yet promise compatibility further back than that.
  upgrade-test:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine the previous published release
        id: previous
        run: |
          set -euo pipefail
          # Sort by actual tag creation date across the whole v0.1.0-*
          # series (alpha and beta both) rather than the previous
          # alpha-only, trailing-number sort - that older approach always
          # resolved to the highest alpha.N tag, even once the beta series
          # existed, silently testing an upgrade from a much older release
          # than the one directly before this one.
          previous_version="$(git for-each-ref 'refs/tags/v0.1.0-*' --sort=-creatordate \
            --format='%(refname:short)' \
            | grep -E '^v0\.1\.0-(alpha|beta)\.[0-9]+$' \
            | grep -v "^v${{ needs.version.outputs.value }}\$" \
            | head -1 | sed 's/^v//' || true)"
          if [ -z "${previous_version}" ]; then
            echo "No previous release exists yet - nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Not the tag itself: it points at the commit where the release was
          # cut, before the pin-update commit that follows it - so, absent
          # this release's own "Point the release tag at the pin-update
          # commit" step (only self-healing for releases cut after that step
          # existed), the tag's own compose.release.yaml can still be pinned to
          # the release *before* it. Searching history for the actual pin
          # commit is correct regardless of whether the tag was ever moved.
          # --follow and the alpha/release alternation handle a previous
          # release cut before the compose.alpha.yaml -> compose.release.yaml
          # rename; the message pattern tolerates both the pre- and
          # post-#298 commit wording ("pin X to V image digests" vs.
          # "ci: pin X, Y, and Z to V") since only the "pin ... to V" core
          # is common to both.
          escaped_version="${previous_version//./\\.}"
          pin_commit="$(git log --format='%H %s' --follow -- compose.release.yaml \
            | grep -iE "pin compose\.(alpha|release)\.yaml.*to ${escaped_version}" \
            | head -1 | cut -d' ' -f1 || true)"
          if [ -z "${pin_commit}" ]; then
            echo "No pin-update commit found for ${previous_version} - nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The historical compose filename may differ from today's
          # convention if the previous release predates a rename - detect
          # which one actually exists in that commit's tree instead of
          # assuming the current name.
          if git cat-file -e "${pin_commit}:compose.release.yaml" 2>/dev/null; then
            pin_compose_path="compose.release.yaml"
          elif git cat-file -e "${pin_commit}:compose.alpha.yaml" 2>/dev/null; then
            pin_compose_path="compose.alpha.yaml"
          else
            echo "Neither compose.release.yaml nor compose.alpha.yaml exists at ${pin_commit} - nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "commit=${pin_commit}" >> "$GITHUB_OUTPUT"
          echo "compose_path=${pin_compose_path}" >> "$GITHUB_OUTPUT"
          echo "version=${previous_version}" >> "$GITHUB_OUTPUT"

      - name: Extract the previous release's correctly pinned Compose model
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git show "${{ steps.previous.outputs.commit }}:${{ steps.previous.outputs.compose_path }}" > compose.release.yaml
          # A previous release predating the compose.alpha.yaml ->
          # compose.release.yaml rename bind-mounts and self-references
          # itself under its own historical name (the updater container's
          # ROOTGUARD_COMPOSE_FILE and volume mount) - keep a copy under
          # that name too so the extracted file's own internal references
          # still resolve, even though every docker compose invocation
          # below uses the canonical compose.release.yaml name.
          if [ "${{ steps.previous.outputs.compose_path }}" != "compose.release.yaml" ]; then
            cp compose.release.yaml "${{ steps.previous.outputs.compose_path }}"
          fi

      - uses: docker/login-action@v4
        if: steps.previous.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the previous release exactly as it shipped
        if: steps.previous.outputs.skip != 'true'
        env:
          # No *_IMAGE overrides here - the previous release's own compose
          # file already pins its own images by digest. Only the *_UPDATE_IMAGE
          # pair is overridden, to the version just published, so the
          # upgrade step below has something real to move to.
          ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.value }}
          ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.value }}
          ROOTGUARD_API_TOKEN: alpha-upgrade-test-token-not-a-real-secret-32
          ROOTGUARD_ADMIN_USER: admin
          ROOTGUARD_ADMIN_PASSWORD: alpha-upgrade-test-password
          ROOTGUARD_RECOVERY_TOKEN: alpha-upgrade-test-recovery-token-not-a-real-secret-32
          ROOTGUARD_WEB_BIND: 127.0.0.1
          ROOTGUARD_WEB_PORT: "18082"
        run: docker compose -f compose.release.yaml up -d

      - name: Install the previous release and verify DNS
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie-jar /tmp/rootguard-upgrade-cookies.txt \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"alpha-upgrade-test-password"}' \
              http://127.0.0.1:18082/api/auth/login || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200
          config='{"dns_bind_address":"127.0.0.1","dns_port":1055}'
          test "$(curl --fail --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18082/api/installation/preflight | jq -r .ready)" = true
          curl --fail --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
            --header 'Content-Type: application/json' --data "$config" \
            http://127.0.0.1:18082/api/installation/deploy >/dev/null
          for attempt in {1..90}; do
            installation="$(curl --fail --silent \
              --cookie /tmp/rootguard-upgrade-cookies.txt \
              http://127.0.0.1:18082/api/installation)"
            state="$(jq -r .state <<<"$installation")"
            if [ "$state" = installed ]; then break; fi
            if [ "$state" = failed ]; then echo "$installation"; exit 1; fi
            sleep 2
          done
          test "$state" = installed
          test -n "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1055 example.com A)"

      - name: Upgrade in place through the real control-plane updater
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          call() {
            local method="$1" path="$2"
            local body code curl_status
            set +e
            body="$(curl --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
              --write-out '\n%{http_code}' --request "$method" "http://127.0.0.1:18082${path}")"
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              echo "::error::${method} ${path}: curl failed with exit code ${curl_status} (could not reach the WebApp)" >&2
              exit 1
            fi
            code="${body##*$'\n'}"
            body="${body%$'\n'*}"
            if [ "${code:0:1}" != 2 ]; then
              echo "::error::${method} ${path} returned HTTP ${code}: ${body}" >&2
              exit 1
            fi
            echo "$body"
          }
          poll_status() {
            local body code curl_status
            set +e
            body="$(curl --silent --cookie /tmp/rootguard-upgrade-cookies.txt \
              --write-out '\n%{http_code}' http://127.0.0.1:18082/api/control-plane-updates)"
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              return 0
            fi
            code="${body##*$'\n'}"
            body="${body%$'\n'*}"
            if [ "${code:0:1}" != 2 ]; then
              echo "::error::GET /api/control-plane-updates returned HTTP ${code}: ${body}" >&2
              exit 1
            fi
            echo "$body"
          }
          for attempt in {1..30}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18082/ || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
            sleep 1
          done
          # The previous release's own Core resolves "latest core/webapp
          # release" itself and sends that as the target_images override -
          # which wins over the updater's own correctly-set
          # ROOTGUARD_*_UPDATE_IMAGE env vars (see targetImageFor in
          # rootguard-updater/main.go). A previous release whose Core still
          # has the pickLatestReleaseImage ordering bug (PR #355) can
          # therefore resolve to some *older* release than the one this job
          # is actually testing, deep-linking the wrong tag straight past
          # the fix - the fix only helps releases *after* the one that
          # first ships it, not the jump onto it. Bypass Core's resolution
          # for exactly that one jump by calling the updater directly with
          # an explicit override, using the same real updater/pull/digest/
          # compose/verify/rollback path either way - only where the
          # *target* tag comes from differs.
          if [ "${{ steps.previous.outputs.version }}" = "0.1.0-beta.12" ]; then
            target_body='{"target_images":{"core":"ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.value }}","webapp":"ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.value }}"}}'
            docker exec rootguard-core wget -qO- \
              --header='Authorization: Bearer alpha-upgrade-test-token-not-a-real-secret-32' \
              --header='Content-Type: application/json' \
              --post-data="$target_body" \
              http://updater:8082/api/control-plane/check >/dev/null
          else
            call POST /api/control-plane-updates/check >/dev/null
          fi
          state=""
          for attempt in {1..90}; do
            status="$(poll_status)"
            if [ -z "$status" ]; then sleep 2; continue; fi
            state="$(jq -r .state <<<"$status")"
            if [ "$state" = idle ]; then break; fi
            if [ "$state" = failed ]; then echo "$status"; exit 1; fi
            sleep 2
          done
          test "$state" = idle
          if [ "${{ steps.previous.outputs.version }}" = "0.1.0-beta.12" ]; then
            docker exec rootguard-core wget -qO- \
              --header='Authorization: Bearer alpha-upgrade-test-token-not-a-real-secret-32' \
              --header='Content-Type: application/json' \
              --post-data="$target_body" \
              http://updater:8082/api/control-plane/update >/dev/null
          else
            call POST /api/control-plane-updates/install >/dev/null
          fi
          # The install swaps the Core and WebApp containers themselves, so
          # the WebApp is expected to be briefly unreachable mid-poll here -
          # unlike everywhere else in this step, that's not a failure.
          state=""
          for attempt in {1..90}; do
            status="$(poll_status)"
            if [ -z "$status" ]; then sleep 2; continue; fi
            state="$(jq -r .state <<<"$status")"
            if [ "$state" = idle ]; then break; fi
            if [ "$state" = failed ]; then echo "$status"; exit 1; fi
            sleep 2
          done
          test "$state" = idle
          echo "$status"
          echo "$status" | jq -r '.history[0].outcome' | grep -qx success || { echo "$status"; exit 1; }

      - name: Verify the running images match the newly published version
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for pair in "rootguard-core:core" "rootguard-webapp:webapp"; do
            container="${pair%%:*}"
            image="${pair##*:}"
            release_ref="ghcr.io/${{ github.repository_owner }}/rootguard-${image}:${{ needs.version.outputs.value }}"
            # The updater itself never relies on a local tag existing (see
            # the digestFromPullOutput fix) - it works entirely off the
            # digest docker pull reports. This check shouldn't assume one
            # either: pull the release tag fresh right here, rather than
            # trusting that some earlier step in this job happened to leave
            # a matching local tag behind as a side effect.
            docker pull "$release_ref" >/dev/null
            expected="$(docker image inspect "$release_ref" --format '{{.Id}}')"
            actual="$(docker inspect "$container" --format '{{.Image}}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${container}: running image ${actual} does not match freshly-pulled ${release_ref} (${expected})"
              docker inspect "$container" --format 'running RepoDigests: {{.Config.Image}}'
              docker image inspect "$release_ref" --format 'release RepoDigests: {{range .RepoDigests}}{{.}} {{end}}'
              exit 1
            fi
          done

      - name: Verify DNS still works after the upgrade
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          test -n "$(dig +short +time=5 +tries=2 @127.0.0.1 -p 1055 example.com A)"
          test "$(dig +dnssec +time=5 +tries=2 @127.0.0.1 -p 1055 \
            dnssec-failed.org A | sed -n \
            's/^;; ->>HEADER<<- opcode: QUERY, status: \([^,]*\).*/\1/p')" = SERVFAIL

      - name: Show logs after failure
        if: failure() && steps.previous.outputs.skip != 'true'
        env:
          ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.value }}
          ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.value }}
          ROOTGUARD_API_TOKEN: alpha-upgrade-test-token-not-a-real-secret-32
          ROOTGUARD_ADMIN_USER: admin
          ROOTGUARD_ADMIN_PASSWORD: alpha-upgrade-test-password
          ROOTGUARD_RECOVERY_TOKEN: alpha-upgrade-test-recovery-token-not-a-real-secret-32
          ROOTGUARD_WEB_BIND: 127.0.0.1
          ROOTGUARD_WEB_PORT: "18082"
        run: docker compose -f compose.release.yaml logs --no-color

      - name: Stop stack
        if: always() && steps.previous.outputs.skip != 'true'
        env:
          ROOTGUARD_CORE_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-core:${{ needs.version.outputs.value }}
          ROOTGUARD_WEBAPP_UPDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/rootguard-webapp:${{ needs.version.outputs.value }}
          ROOTGUARD_API_TOKEN: alpha-upgrade-test-token-not-a-real-secret-32
          ROOTGUARD_ADMIN_USER: admin
          ROOTGUARD_ADMIN_PASSWORD: alpha-upgrade-test-password
          ROOTGUARD_RECOVERY_TOKEN: alpha-upgrade-test-recovery-token-not-a-real-secret-32
          ROOTGUARD_WEB_BIND: 127.0.0.1
          ROOTGUARD_WEB_PORT: "18082"
        run: docker compose -f compose.release.yaml down --volumes
