server:
    username: ""
    pidfile: ""
    logfile: ""
    verbosity: 0

    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    module-config: "iterator"
    access-control: 0.0.0.0/0 allow

    local-zone: "example." static
    local-data: "example. 60 IN SOA ns.example. hostmaster.example. 1 60 60 60 60"
    local-data: "example. 60 IN NS ns.example."
    local-data: "example. 60 IN A 192.168.50.80"
    local-data: "ns.example. 60 IN A 172.30.54.2"
