vulnerabilities:
  - id: GO-2026-5932
    paths:
      - "rootguard-core/go.mod"
    expired_at: 2026-11-11
    statement: >-
      RootGuard uses x/crypto through age but does not import the affected,
      unmaintained openpgp package. govulncheck and the complete Go dependency
      graph confirm that no vulnerable code is reachable. Recheck this scoped
      exception when age or x/crypto is updated.

  # Bundled upstream Go binaries in Core/Updater (docker CLI, its compose
  # plugin, cosign): RootGuard can't rebuild them, so findings in their Go
  # toolchain or vendored modules are reviewed here. Every entry is scoped
  # by `purls` with the exact installed version and by `paths` to the
  # binary trivy reported it in (review rounds 13-15), so any update of
  # those binaries re-surfaces the finding for a fresh look. cosign v3.1.4
  # (#766) retired the 17 entries for v3.1.3's dependencies.
  #
  # #766, 2026-10-21: Go 1.26.10/1.27.3 add a denylist of compromised
  # intermediate CAs to crypto/x509's Certificate.Verify (GO-2026-6809).
  # RootGuard's own binaries build with 1.26.10; the bundled ones can't be
  # rebuilt here (docker 1.26.9 and compose 1.26.8 in the newest
  # docker:29-cli build, cosign v3.1.4 on 1.27.1).
  - id: CVE-2026-111943
    purls:
      - "pkg:golang/stdlib@v1.26.9"
      - "pkg:golang/stdlib@v1.26.8"
      - "pkg:golang/stdlib@v1.27.1"
    paths:
      - "usr/local/bin/docker"
      - "usr/local/libexec/docker/cli-plugins/docker-compose"
      - "usr/local/bin/cosign"
    expired_at: 2026-11-21
    statement: >-
      docker and compose reach the daemon only over plain TCP
      (DOCKER_HOST=tcp://docker-proxy:2375), so they never verify a
      certificate chain; image pulls run in the host daemon. cosign's TLS
      goes only to the attestation proxy's three allowlisted hosts, and its
      trust in an attestation comes from Sigstore's TUF-signed root and
      signature/transparency-log verification, not from the TLS server
      certificate: a man-in-the-middle with a mis-issued certificate could
      withhold data, making verification fail closed, but not forge an
      attestation. Recheck when cosign or docker:29-cli ship builds on
      Go >= 1.26.10 / 1.27.3.
  # Found live, 2026-10-09 (#699): Go 1.26.9's net/http fix. RootGuard's own
  # binaries now build with 1.26.9, and so does the docker CLI since #703;
  # the two remaining bundled binaries can't be rebuilt here - cosign v3.1.4
  # (the newest, #766) is on Go 1.27.1, compose 5.6.0 (the newest) on Go
  # 1.26.8. Both run as short-lived HTTP clients only (cosign via the
  # attestation proxy, compose against the internal docker-proxy), never
  # as an HTTP server.
  - id: CVE-2026-78667
    purls:
      - "pkg:golang/stdlib@v1.27.1"
      - "pkg:golang/stdlib@v1.26.8"
    paths:
      - "usr/local/bin/cosign"
      - "usr/local/libexec/docker/cli-plugins/docker-compose"
    expired_at: 2026-11-30
    statement: >-
      Go stdlib net/http CVE baked into the upstream toolchain of the
      bundled cosign/compose binaries, used only as short-lived HTTP
      clients - see the comment above.
  # Same Go 1.26.9 release, surfaced by trivy's DB one day later (#699).
  # docker/compose never speak TLS here (plain tcp://docker-proxy:2375);
  # cosign's only TLS peers are the attestation proxy's fixed GitHub/
  # Sigstore allowlist (ghcr.io, pkg-containers.githubusercontent.com,
  # tuf-repo-cdn.sigstore.dev, api.github.com).
  - id: CVE-2026-97031
    purls:
      - "pkg:golang/stdlib@v1.27.1"
      - "pkg:golang/stdlib@v1.26.8"
    paths:
      - "usr/local/bin/cosign"
      - "usr/local/libexec/docker/cli-plugins/docker-compose"
    expired_at: 2026-11-30
    statement: >-
      Go stdlib crypto/tls CVE in the bundled upstream binaries' toolchain;
      docker/compose use no TLS here and cosign only reaches the attestation
      proxy's allowlisted hosts - see the comment above.
  # Found live, 2026-10-14 (#709): trivy rated another Go 1.26.9 / x/net
  # 0.60.0 fix HIGH - HTTP/2 DoS via excessive SETTINGS frames, both in
  # x/net/http2 and Go's bundled net/http copy. Still no newer compose
  # (5.6.0) release; cosign v3.1.4 (#766) fixed its x/net copy. compose
  # speaks plain HTTP/1.1 to tcp://docker-proxy:2375 (no TLS, so no
  # HTTP/2 negotiation); cosign's only HTTPS peers are the attestation
  # proxy's allowlist above.
  - id: CVE-2026-78669
    purls:
      - "pkg:golang/golang.org/x/net@v0.58.0"
      - "pkg:golang/stdlib@v1.27.1"
      - "pkg:golang/stdlib@v1.26.8"
    paths:
      - "usr/local/bin/cosign"
      - "usr/local/libexec/docker/cli-plugins/docker-compose"
    expired_at: 2026-11-30
    statement: >-
      HTTP/2 SETTINGS-flood DoS in the bundled cosign/compose binaries'
      x/net and stdlib; compose never negotiates HTTP/2 here and cosign
      only reaches allowlisted GitHub/Sigstore hosts - see the comment
      above.

  # Found in review, round 14: Unbound's debian:13-slim-based image
  # wasn't scanned by any CI job at all until this round's own
  # trivy-image-scan.sh addition (ci-unbound.yml) - these 20 entries are
  # every one of its remaining findings after the util-linux family fix
  # above (Dockerfile) closed the other 4. Each was checked individually,
  # live, against the Debian Security Tracker (not assumed) - every one
  # is Debian's own <no-dsa>/"minor issue"/"postponed" classification for
  # trixie, with the fix only in unstable/forky (not yet a stable point
  # release RootGuard could pin to the way the util-linux fix above did).
  # `purls` scopes each to the exact Debian package trivy reported it
  # against - per review, an unscoped entry would also hide the same CVE
  # ID anywhere else it might later appear (a different image, a
  # genuinely reachable RootGuard binary), which none of these need.
  # Found in review, round 15: every purl below now includes the exact
  # installed version trivy itself reported (confirmed live against a
  # real scan's own PURL field), same reasoning as the round-13 block's
  # own identical fix above - a bare `pkg:deb/debian/<name>` (no version)
  # would keep suppressing the CVE ID for a version change that might
  # genuinely need re-checking, and the review's own separate caution
  # applies here too: these are Debian-specific package identities,
  # scoped to this Unbound image's own base - never assume the same
  # ignore is still correct for some other, future Debian-based image
  # this repo might add.
  - id: CVE-2026-9538
    purls: ["pkg:deb/debian/perl-base@5.40.1-6%2Bdeb13u1"]
    expired_at: 2026-11-30
    statement: >-
      Debian fix_deferred, no fix planned for trixie. The flaw is in
      Archive::Tar (shipped in perl-modules-5.40), which this image does
      not contain: perl-base is Essential in the debian:13-slim base, has
      no Archive/Tar.pm, and none of the runtime stage's apt packages pull
      in a perl module package (confirmed with `apt-get install -s`).
      Trivy attributes the CVE to every binary of the perl source package.
      Surfaced by the Debian 13.7 base bump (perl-base 5.40.1-6 ->
      5.40.1-6+deb13u1); the version-scoped purl makes the next perl-base
      change re-check it.
  - id: CVE-2019-16224
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie (confirmed live). liblmdb0
      arrives only as bind9-libs' own dependency (bind9-dnsutils, for
      `dig` in health checks/diagnostics - confirmed live via
      packages.debian.org) - Unbound's own resolver process never uses
      it. The CVE text itself describes py-lmdb (the Python binding),
      not the plain C library this image links.
  - id: CVE-2019-16225
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2019-16226
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2019-16227
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2019-16228
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2025-69720
    # All three ncurses binary packages this image carries, not just
    # libtinfo6 - confirmed live via a second scan pass (this entry's
    # first version scoped only libtinfo6 and still failed CI on the
    # other two).
    purls:
      - "pkg:deb/debian/libtinfo6@6.5%2B20250216-2"
      - "pkg:deb/debian/ncurses-base@6.5%2B20250216-2"
      - "pkg:deb/debian/ncurses-bin@6.5%2B20250216-2"
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, "Minor issue, Crash in CLI tool" - unfixed in
      trixie (confirmed live). Stack overflow in infocmp, a terminfo CLI
      tool nothing in this image's own entrypoint/healthcheck ever
      invokes.
  - id: CVE-2026-54369
    purls: ["pkg:deb/debian/libacl1@2.3.2-2%2Bb1"]
    expired_at: 2026-11-30
    statement: >-
      Unfixed in trixie (confirmed live) - Debian's own tracker note
      says the fix lands "first in unstable, then point release update;
      not to be backported by individual patches". Symlink-traversal
      issue in libacl's pathname-based functions; this image's own
      entrypoint/healthcheck never calls into libacl at all.
  - id: CVE-2026-6653
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, "minor issue" - unfixed in trixie (confirmed
      live). Use-after-free in libxml2's internal-subset parsing;
      libxml2 arrives only as bind9-libs' own dependency (see
      CVE-2019-16224's statement above) - Unbound's own resolver process
      doesn't use it.
  - id: CVE-2026-86140
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Found live, 2026-09-08 (second external review round, unrelated CI
      failure on an otherwise unrelated PR - confirmed the same failure
      already broke main's own Unbound CI independently). Unfixed in
      trixie (confirmed live via the Debian Security Tracker; fixed only
      in sid at 2.15.4). strcat stack-based buffer overflow in
      xmlSnprintfElements; libxml2 arrives only as bind9-libs' own
      dependency - see CVE-2019-16224's/CVE-2026-6653's identical
      statement above on why Unbound's own resolver process is
      unaffected.
  - id: CVE-2026-74860
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Found live, 2026-09-11 (second full code-check round, blocking
      ci-unbound.yml on every unrelated PR). Trivy reports no fixed
      version for trixie (Status: affected). Double-free/use-after-free
      in libxml2's own Python bindings (python3-libxml2) - this image has
      no Python interpreter or Python bindings package installed at all
      (confirmed: no python/libxml2-python reference anywhere in the
      Dockerfile), on top of the same "libxml2 arrives only as
      bind9-libs' dependency, Unbound's own resolver process doesn't use
      it" reasoning as CVE-2026-6653/CVE-2026-86140 above - doubly
      unreachable here.
  # Found live, 2026-09-16 (scheduled ci-unbound.yml run on main, no code
  # change involved). Five new libxml2 findings at the exact same
  # already-suppressed version above - confirmed individually, live,
  # against the Debian Security Tracker: all five show "vulnerable" for
  # both trixie and trixie-security, fixed only in forky/sid at
  # 2.15.4+dfsg-1 (no trixie point release exists to pin to instead).
  # Same reachability reasoning as every other libxml2 entry above -
  # libxml2 arrives only as bind9-libs' own dependency (bind9-dnsutils,
  # for `dig` in health checks/diagnostics), Unbound's own resolver
  # process never uses it.
  - id: CVE-2026-86138
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Integer overflow and resultant heap-based buffer overflow in
      xmlDictAddQString (dict.c) - unfixed in trixie (confirmed live) -
      see CVE-2019-16224's identical reachability statement above.
  - id: CVE-2026-86139
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Integer overflow in xmlURIEscapeStr (uri.c) - unfixed in trixie
      (confirmed live) - see CVE-2019-16224's identical reachability
      statement above.
  - id: CVE-2026-86142
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Heap-based buffer overflow in xmlXPtrEvalXPtrPart from xpointer
      length saturation - unfixed in trixie (confirmed live) - see
      CVE-2019-16224's identical reachability statement above.
  - id: CVE-2026-86143
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      Negative lengths reaching xmlIO write callbacks from an
      xmlOutputWriteCallback/xmlBufUse inconsistency - unfixed in trixie
      (confirmed live) - see CVE-2019-16224's identical reachability
      statement above.
  - id: CVE-2026-86144
    purls: ["pkg:deb/debian/libxml2@2.12.7%2Bdfsg%2Breally2.9.14-2.1%2Bdeb13u3"]
    expired_at: 2026-11-30
    statement: >-
      xmlXIncludeProcess/xmlXIncludeProcessTree not propagating
      parseFlags (e.g. XML_PARSE_NONET), relevant to XXE/SSRF for callers
      with a custom network-capable resource loader - unfixed in trixie
      (confirmed live). This image never calls libxml2's XInclude
      processing at all - see CVE-2019-16224's identical reachability
      statement above.
  - id: CVE-2026-16742
    purls: ["pkg:deb/debian/libsystemd0@257.13-1~deb13u1"]
    expired_at: 2026-11-30
    statement: >-
      Local privilege escalation in systemd-homed via missing home-record
      signature verification - this image never runs systemd itself (no
      init, no systemd-homed daemon; libsystemd0 is only a linked
      dependency pulled in by another package), so the vulnerable daemon
      is never invoked.
  - id: CVE-2026-16742
    purls: ["pkg:deb/debian/libudev1@257.13-1~deb13u1"]
    expired_at: 2026-11-30
    statement: >-
      Same finding, same reasoning as libsystemd0 immediately above -
      libudev1 is a linked dependency only, systemd-homed never runs in
      this image.

  # Found live, round of PR #488: trivy's own vulnerability DB surfaced
  # these only now - genuinely new since the round-14/15 Unbound scans,
  # not something either round missed. (Its second family, two libevent
  # CVEs, is gone: trivy's DB now carries Debian's fix, #718.)
  #
  # 1. Four new util-linux CVEs (CVE-2026-76642/78408/78409/78410), all at
  #    the exact same 2.41.5-0+deb13u1 the Dockerfile already explicitly
  #    pinned to fix the *previous* four (CVE-2026-53612..53615, see the
  #    Dockerfile's own comment) - confirmed live via the Debian Security
  #    Tracker: "vulnerable (no DSA)" in trixie/trixie-security, fixed only
  #    in sid/forky at 2.42.3-1, no trixie point release exists yet to pin
  #    to instead. All four are mount/nsenter/cgroup-migration/bind-mount
  #    issues (failed external mount helper cleanup, `nsenter
  #    --join-cgroup` root leak, `X-mount.subdir` detached-tree handling,
  #    restricted bind mounts not pinning propagation) - this image never
  #    calls mount, nsenter, or any cgroup-migration tooling at runtime;
  #    the util-linux family is present only because it's part of
  #    debian:13-slim's own base install (dnsutils/login's own
  #    dependencies), same reachability reasoning as the round-14 block
  #    above. All nine binary packages share the one util-linux source
  #    package, so all nine need every one of the four IDs listed the same
  #    way the Dockerfile comment already documents for the prior batch.
  - id: CVE-2026-76642
    purls:
      - "pkg:deb/debian/bsdutils@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libblkid1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/liblastlog2-2@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libmount1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libsmartcols1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libuuid1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/login@4.16.0-2+really2.41.5-0+deb13u1"
      - "pkg:deb/debian/mount@2.41.5-0+deb13u1"
      - "pkg:deb/debian/util-linux@2.41.5-0+deb13u1"
    expired_at: 2026-11-30
    statement: >-
      util-linux: failed external mount helper cleanup - unfixed in
      trixie, this image never invokes mount or any external mount helper
      at runtime - see the comment above this block.
  - id: CVE-2026-78408
    purls:
      - "pkg:deb/debian/bsdutils@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libblkid1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/liblastlog2-2@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libmount1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libsmartcols1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libuuid1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/login@4.16.0-2+really2.41.5-0+deb13u1"
      - "pkg:deb/debian/mount@2.41.5-0+deb13u1"
      - "pkg:deb/debian/util-linux@2.41.5-0+deb13u1"
    expired_at: 2026-11-30
    statement: >-
      util-linux: nsenter --join-cgroup root leak - unfixed in trixie,
      this image never invokes nsenter at runtime - see the comment above
      this block.
  - id: CVE-2026-78409
    purls:
      - "pkg:deb/debian/bsdutils@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libblkid1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/liblastlog2-2@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libmount1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libsmartcols1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/libuuid1@2.41.5-0+deb13u1"
      - "pkg:deb/debian/login@4.16.0-2+really2.41.5-0+deb13u1"
      - "pkg:deb/debian/mount@2.41.5-0+deb13u1"
      - "pkg:deb/debian/util-linux@2.41.5-0+deb13u1"
    expired_at: 2026-11-30
    statement: >-
      util-linux: X-mount.subdir detached-tree handling - unfixed in
