  # CVE-2026-56854 affects the SSH server-side NewServerConn path that
  # enforces source-address critical options returned by authentication
  # callbacks. RootGuard invokes both bundled tools as clients only:
  # cosign verifies registry attestations and compose talks to the local
  # Docker socket. Keep each suppression tied to the exact binary and
  # dependency version so another bundled Go binary cannot inherit it.
  - id: CVE-2026-56854
    purls: ["pkg:golang/golang.org/x/crypto@v0.53.0"]
    paths: ["usr/local/bin/cosign"]
    expired_at: 2026-11-30
    statement: >-
      cosign v3.1.3 contains the affected x/crypto version, but RootGuard
      uses cosign only for registry-attestation verification and never
      invokes the vulnerable SSH server-side NewServerConn path.
  - id: CVE-2026-56854
    purls: ["pkg:golang/golang.org/x/crypto@v0.54.0"]
    paths: ["usr/local/libexec/docker/cli-plugins/docker-compose"]
    expired_at: 2026-11-30
    statement: >-
      the bundled compose plugin contains the affected x/crypto version,
      but RootGuard connects it only to the local Docker socket and never
      invokes the vulnerable SSH server-side NewServerConn path.

  # Found in review, round 14: Unbound's debian:13-slim-based image
  # wasn't scanned by any CI job at all until this round's own
  # trivy-image-scan.sh addition (ci-unbound.yml) - these 20 entries are
  # every one of its remaining findings after the util-linux family fix
  # above (Dockerfile) closed the other 4. Each was checked individually,
  # live, against the Debian Security Tracker (not assumed) - every one
  # is Debian's own <no-dsa>/"minor issue"/"postponed" classification for
  # trixie, with the fix only in unstable/forky (not yet a stable point
  # release RootGuard could pin to the way the util-linux fix above did).
  # `purls` scopes each to the exact Debian package trivy reported it
  # against - per review, an unscoped entry would also hide the same CVE
  # ID anywhere else it might later appear (a different image, a
  # genuinely reachable RootGuard binary), which none of these need.
  # Found in review, round 15: every purl below now includes the exact
  # installed version trivy itself reported (confirmed live against a
  # real scan's own PURL field), same reasoning as the round-13 block's
  # own identical fix above - a bare `pkg:deb/debian/<name>` (no version)
  # would keep suppressing the CVE ID for a version change that might
  # genuinely need re-checking, and the review's own separate caution
  # applies here too: these are Debian-specific package identities,
  # scoped to this Unbound image's own base - never assume the same
  # ignore is still correct for some other, future Debian-based image
  # this repo might add.
  - id: CVE-2019-16224
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie (confirmed live). liblmdb0
      arrives only as bind9-libs' own dependency (bind9-dnsutils, for
      `dig` in health checks/diagnostics - confirmed live via
      packages.debian.org) - Unbound's own resolver process never uses
      it. The CVE text itself describes py-lmdb (the Python binding),
      not the plain C library this image links.
  - id: CVE-2019-16225
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2019-16226
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2019-16227
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2019-16228
    purls: ["pkg:deb/debian/liblmdb0@0.9.31-1%2Bb2"]
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, unfixed in trixie - see CVE-2019-16224's identical
      statement above.
  - id: CVE-2025-69720
    # All three ncurses binary packages this image carries, not just
    # libtinfo6 - confirmed live via a second scan pass (this entry's
    # first version scoped only libtinfo6 and still failed CI on the
    # other two).
    purls:
      - "pkg:deb/debian/libtinfo6@6.5%2B20250216-2"
      - "pkg:deb/debian/ncurses-base@6.5%2B20250216-2"
      - "pkg:deb/debian/ncurses-bin@6.5%2B20250216-2"
    expired_at: 2026-11-30
    statement: >-
      Debian <no-dsa>, "Minor issue, Crash in CLI tool" - unfixed in
