  # Found live, round 15: trivy's own vulnerability DB surfaced these
  # only now - genuinely new since round 14's own Unbound scan, not
  # something that round missed. Unlike the other Unbound findings above
  # (all transitively-pulled diagnostic tooling), libevent is a real,
  # direct build dependency Unbound links against for its own event loop
  # (--with-libevent, see rootguard-unbound/Dockerfile) - a materially
  # different reachability question, checked accordingly: Unbound
  # implements DNS wire-format parsing entirely itself and never uses
  # libevent's own bundled `evdns` convenience API or its RPC/tagging
  # framework (`event_rpcgen`/`event_tagging.c`) - it only uses
  # libevent's event-loop/socket-buffering primitives (event_base,
  # bufferevent). All four findings below are in exactly those two unused
  # subsystems. Confirmed unfixed in trixie live (Debian Security
  # Tracker) - no `<no-dsa>` classification exists yet either, this is
  # simply too new; fixed only in forky/sid at 2.1.13-stable-1.
  - id: CVE-2026-63383
    purls: ["pkg:deb/debian/libevent-2.1-7t64@2.1.12-stable-10%2Bb1"]
    expired_at: 2026-11-30
    statement: >-
      event_tagging.c (evtag_unmarshal_header) - libevent's own RPC/
      tagging framework, which Unbound never uses. Unfixed in trixie,
      confirmed live - see the comment above this block.
  - id: CVE-2026-63384
    purls: ["pkg:deb/debian/libevent-2.1-7t64@2.1.12-stable-10%2Bb1"]
    expired_at: 2026-11-30
    statement: >-
      event_tagging.c (evtag_unmarshal_header/evtag_unmarshal_string) -
      libevent's own RPC/tagging framework, which Unbound never uses -
      see CVE-2026-63383's identical statement above.
  - id: CVE-2026-63387
    purls: ["pkg:deb/debian/libevent-2.1-7t64@2.1.12-stable-10%2Bb1"]
    expired_at: 2026-11-30
