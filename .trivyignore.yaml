      exception when age or x/crypto is updated.

  # Found in review, round 13: trivy-image-scan.sh (added this round)
  # scans Core/Updater's built images - every entry below is a HIGH
  # finding it surfaced that isn't fixable by RootGuard itself today,
  # confirmed live against a real `rootguard-updater:test` build after
  # every actionable fix this round already landed (Alpine's
  # libssl3/libcrypto3 patched, the unused buildx plugin removed, cosign
  # bumped to the newest available release, v3.1.3).
  #
  # Found in review, round 14: every entry here originally had neither
  # `paths` nor `purls`, so - per trivy's own documented behavior - each
  # applied globally to that CVE ID wherever it might ever appear, not
  # just in the specific package this Dockerfile actually can't fix
  # today. `purls` now scopes each to the exact package trivy reported it
  # against. The same review pass also caught three statements that were
  # simply wrong: CVE-2026-56852 is a `golang.org/x/text` CVE, and
  # CVE-2026-56864/CVE-2026-56865 are `golang.org/x/mod` CVEs - none of
  # the three are Go standard-library code, so bumping the Go toolchain
  # that built these binaries doesn't fix them; they need cosign/compose
  # to bump their own vendored dependency instead (`golang.org/x/mod` to
  # v0.40.0, confirmed live against each CVE's own advisory).
  #
  # Found in review, round 15: `purls` alone still wasn't precise enough
  # - a bare `pkg:golang/stdlib` (no version) still suppresses every
  # version of that package, not just the ones actually affected, so a
  # later Go-toolchain bump that leaves the CVE ID reused for a
  # completely different package could stay silently hidden. Every purl
  # below now includes the exact installed version(s) trivy itself
  # reported (confirmed live against a real scan's own PURL field, not
  # guessed) - docker CLI and the compose plugin share one Go toolchain
  # (stdlib v1.26.5), cosign a separate, older one (v1.26.4), so the
  # eight shared stdlib CVEs below each need both versions listed to stay
  # precise without narrowing to just one binary. Also per review: each
  # entry now additionally carries `paths`, listing exactly which of the
  # three bundled Go binaries (docker CLI, its compose plugin, cosign)
  # trivy's own scan of this image reported the finding against - read
  # from that scan's own per-binary `Target` field, not guessed. trivy
  # requires paths and purls to both match, so this narrows each entry to
  # the specific binary file(s) actually carrying that package/version,
  # not merely the package/version wherever it might appear.
  #
  # The nine genuine Go-stdlib CVEs below are baked into the *upstream*
  # Go toolchain that built the docker CLI binary, its bundled compose
  # plugin, and/or cosign - not something an apk pin or a version bump to
  # the newest available release can fix, since even cosign's newest
  # release (v3.1.3, 2026-08-06) predates the Go release that carries
  # these particular fixes (1.26.6, 2026-08-13). Recheck when a newer
  # build of each exists. CVE-2026-41567/CVE-2026-42306 (the same
  # `docker cp` CVEs the new Preflight advisory warns about at the *host
  # Docker Engine* level) show up in the compose plugin's own vendored
  # `github.com/docker/docker` client library, but compose's own binary
  # never calls the vulnerable code path (container-to-host archive
  # extraction only happens via `docker cp` itself, which compose doesn't
  # implement or expose) - the vendored code is present but not reachable
  # through anything this image runs.
  - id: CVE-2026-33818
    purls:
      - "pkg:golang/stdlib@v1.26.4"
      - "pkg:golang/stdlib@v1.26.5"
    paths:
      - "usr/local/bin/cosign"
      - "usr/local/bin/docker"
      - "usr/local/libexec/docker/cli-plugins/docker-compose"
    expired_at: 2026-11-30
    statement: >-
      Go stdlib CVE baked into the upstream Go toolchain that built the
      docker CLI/compose/cosign binaries this image bundles - see the
      comment above this block.
