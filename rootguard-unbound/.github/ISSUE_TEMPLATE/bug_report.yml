name: Bug report
description: Report reproducible resolver or image behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: image
    attributes:
      label: Image tag and architecture
      placeholder: latest, amd64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected DNS behavior and remove private data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and dig output
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Docker version, and configuration mounts
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private domains, addresses, and other sensitive data.
          required: true
