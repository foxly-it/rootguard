<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/rootguard-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1c2f" />
    <title>RootGuard</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("rootguard.theme");
          var mode = stored === "light" || stored === "dark" ? stored : "system";
          var resolved =
            mode === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : mode;
          if (resolved === "light") document.documentElement.dataset.theme = "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
