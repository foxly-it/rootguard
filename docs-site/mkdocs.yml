site_name: RootGuard Docs
site_url: https://rootguard.foxly.de/docs/
site_description: RootGuard Dokumentation - Installation, Konfiguration, Betrieb und Sicherheit.
repo_url: https://github.com/foxly-it/rootguard
repo_name: foxly-it/rootguard
edit_uri: edit/main/docs-site/docs/
docs_dir: docs
site_dir: ../site/docs
copyright: "© Mark Schenk · Foxly IT"

theme:
  name: material
  logo: assets/rootguard-icon.svg
  favicon: assets/rootguard-icon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  # Single dark scheme, no light/dark toggle - matching the main
  # rootguard.foxly.de site, which has no light theme either. Trying to
  # support both meant the header (styled to match the main site's dark
  # look) clashed hard against a white light-mode body for anyone whose
  # system defaults to light - simpler and more consistent to just not
  # offer a light mode at all.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/foxly-it/rootguard

nav:
  - Home: index.md
  - Erste Schritte: getting-started.md
  - WebGUI:
      - Überblick: webgui.md
      - Unbound: webgui/unbound.md
  - Anwendungsbeispiele:
      - Unbound: guides/unbound-examples.md
      - HTTPS über einen Reverse-Proxy: guides/https-reverse-proxy.md
  - Sicherheit: security/threat-model.md
  - Betrieb: operations.md
  - Referenz:
      - Umgebungsvariablen: reference/environment-variables.md
  - Über:
      - Lizenz: about/license.md
